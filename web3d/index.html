<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RythmnEscape 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 세로 한 화면 앱: 위 HUD / 가운데 3D 무대 / 아래 박자 바. 네온 아케이드 단일 다크 룩. */
  :root {
    color-scheme: dark;
    --bg: #0d0f1e;
    --panel: #171a33;
    --panel-2: #2a2f5c;
    --line: #2c3160;
    --text: #e8eaff;
    --muted: #8b90b8;
    --yellow: #ffd23f;
    --green: #3ee6a0;
    --red: #ff5a6a;
    --ink: #1b1d24;
    --on-yellow: #231c00;
    --font: "Jua", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app {
    touch-action: none;             /* 스와이프가 페이지 스크롤/확대로 새지 않게 */
    position: relative;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  #hud {
    display: flex; align-items: flex-start; gap: 12px;
    padding-block: 14px 4px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  #hud .left { flex: 1; min-width: 0; }
  #stageName { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stageSub, #info { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #hud .right { text-align: right; }
  #score { font-size: 22px; color: var(--yellow); font-variant-numeric: tabular-nums; }
  #info { font-variant-numeric: tabular-nums; }

  #stage { position: relative; flex: 1; min-height: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .float {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
  }
  #judge { top: 4%; font-size: 30px; opacity: 0; }
  #judge.show { animation: judge 0.6s ease-out forwards; }
  @keyframes judge {
    0% { opacity: 1; transform: scale(1.25); }
    25% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(1); }
  }
  #count { top: 28%; font-size: 96px; opacity: 0; }
  #mapBtn {
    position: absolute; top: 8px; right: var(--gutter-r); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: rgba(23, 26, 51, 0.88); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  #mapBtn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #mapBtn.on { border-color: var(--yellow); color: var(--yellow); }
  #minimap { display: block; }

  #bottom {
    display: flex; flex-direction: column; gap: 10px;
    padding-block: 6px 16px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  #hint { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.4; min-height: 2.8em; text-wrap: balance; }
  #beatbar { width: 100%; height: 58px; display: block; }
  .row { display: flex; gap: 10px; }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pad .btn { height: 58px; padding: 0; font-size: 22px; }
  #pad .wait { font-size: 16px; color: var(--muted); }
  #pad .small { font-size: 15px; background: transparent; border: 2px solid var(--line); color: var(--muted); }
  @media (max-height: 700px) {            /* 작은 화면: 패드/박자 바를 줄여 무대를 넓게 */
    #pad { gap: 6px; }
    #pad .btn { height: 46px; }
    #beatbar { height: 44px; }
    #bottom { gap: 8px; padding-block: 4px 10px; }
  }
  .row > .btn { flex: 1; }

  .btn {
    font: inherit; font-size: 17px; color: var(--text);
    background: var(--panel-2); border: none; border-radius: 14px;
    padding: 12px 16px; cursor: pointer; touch-action: manipulation;
  }
  .btn:active { filter: brightness(0.88); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn.primary { background: var(--yellow); color: var(--on-yellow); }
  .btn.icon { width: 48px; height: 48px; padding: 0; font-size: 16px; }

  .layer {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  #overlay { background: rgba(8, 9, 20, 0.62); }
  .panel {
    width: 100%; max-width: 420px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 24px;
    padding: 24px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  #ovTitle { font-size: 36px; text-wrap: balance; }
  #ovSub { color: var(--muted); font-size: 16px; line-height: 1.5; white-space: pre-line; }
  #ovButtons { display: flex; flex-direction: column; gap: 10px; }

  #select { touch-action: pan-y; background: var(--bg); overflow-y: auto; align-items: safe center; padding-block: 24px; }
  #select .inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
  #select h1 { margin: 0; font-weight: 400; font-size: 44px; color: var(--yellow); text-align: center; letter-spacing: 0.5px; }
  #select .tag { margin: -8px 0 0; color: var(--muted); text-align: center; }
  #stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #stages .btn { aspect-ratio: 1.3; max-width: 100%; font-size: 26px; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stages .rank { font-size: 14px; }
  .setting { display: flex; align-items: center; gap: 10px; }
  .setting .cap { flex: 1; color: var(--muted); }
  #offset { min-width: 76px; text-align: center; font-variant-numeric: tabular-nums; }
  .help { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { #judge.show { animation-duration: 0.01s; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="left">
      <div id="stageName">RythmnEscape</div>
      <div id="stageSub"></div>
    </div>

  <main id="stage">

    <div id="pad" hidden>
      <button class="btn small" id="padMenu">메뉴</button>

    </div>
  </footer>

  <div class="layer" id="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ovTitle">

  <div class="layer" id="select" hidden>
    <div class="inner">
      <h1>RythmnEscape</h1>
      <p class="tag">비트에 맞춰 점프! 적을 피해 탈출하세요</p>
      <div id="stages"></div>
      <button class="btn" id="modeBtn">리듬 모드</button>
      <button class="btn" id="controlBtn">조작: 십자 패드</button>
      <div class="setting">
        <span class="cap">소리 지연 보정</span>
        <button class="btn icon" id="offMinus" aria-label="보정 10ms 줄이기">-</button>
        <span id="offset">+0 ms</span>
        <button class="btn icon" id="offPlus" aria-label="보정 10ms 늘리기">+</button>
      </div>
      <p class="help">소리가 화면보다 늦게 들리면 + 를 눌러 보세요.<br>PC: 방향키/WASD 점프 · Space 대기 · R 다시하기 · Esc 일시정지</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="logic">
// ===================== 게임 로직 (렌더링과 분리 — Godot 버전과 같은 규칙) =====================
// 맵 기호: # 벽  . 바닥  ~ 무너지는 발판  P 플레이어  E 출구  > < v ^ 순찰병  C 추적자
const LEVELS = [
  { name: "1. 첫 점프", bpm: 84, hint: "한 칸씩 점프해서 초록색 출구까지 가세요.",
    map: ["#######", "#P....#", "#.###.#", "#.#E..#", "#.###.#", "#.....#", "#######"] },
  { name: "2. 순찰병", bpm: 90, hint: "빨간 점선 칸은 적이 다음 박자에 올 자리예요. 피하거나 제자리에서 기다리세요.",
    map: ["#########", "#P......#", "#.#####.#", "#...<...#", "#.#####.#", "#......E#", "#########"] },
  { name: "3. 엇갈리는 길", bpm: 96, hint: "순찰병 둘이 길을 가로막아요. 타이밍을 보고 사이로 빠져나가세요.",
    map: ["#########", "#P..#...#", "#.#.v.#.#", "#.......#", "#.#.#.#.#", "#...^...#", "###.#.#.#", "#E......#", "#########"] },
  { name: "4. 추적자", bpm: 96, hint: "보라색 추적자는 한 박자 늦게 당신을 쫓아와요. 기둥을 돌아 따돌리세요.",
    map: ["#########", "#P......#", "#.##.##.#", "#...C...#", "#.##.##.#", "#.......#", "#.##.##.#", "#......E#", "#########"] },
  { name: "5. 무너지는 다리", bpm: 100, hint: "갈색 발판은 밟고 떠나면 무너져요. 적은 구멍을 건널 수 없어요.",
    map: ["###########", "#P..#.....#", "#...#.###.#", "#...~.#E#.#", "#C..#.#...#", "###########"] },
  { name: "6. 탈출", bpm: 104, hint: "지금까지 배운 걸 모두 써서 탈출하세요!",
    map: ["###########", "#P....#...#", "#.###.#.#.#", "#.....~.#E#", "#.#.#.#.#.#", "#..C..#>..#", "###########"] },
];

const DIRS = {
  up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 }, wait: { x: 0, y: 0 },
};

function parseLevel(level) {
  const grid = [], enemies = [];
  let player = null;
  level.map.forEach((row, y) => {
    const r = [];
    [...row].forEach((ch, x) => {
      let t = "floor";
      if (ch === "#") t = "wall";
      else if (ch === "~") t = "crumble";
      else if (ch === "E") t = "exit";
      else if (ch === "P") player = { x, y };
      else if (ch === ">") enemies.push({ type: "patrol", x, y, dx: 1, dy: 0 });
      else if (ch === "<") enemies.push({ type: "patrol", x, y, dx: -1, dy: 0 });
      else if (ch === "v") enemies.push({ type: "patrol", x, y, dx: 0, dy: 1 });
      else if (ch === "^") enemies.push({ type: "patrol", x, y, dx: 0, dy: -1 });
      else if (ch === "C") enemies.push({ type: "chaser", x, y, dx: 0, dy: 0 });
      r.push(t);
    });
    grid.push(r);
  });
  return { grid, player, enemies: enemies.map((e, id) => ({ ...e, id, intent: null })) };
}

function tileAt(s, x, y) {
  if (y < 0 || y >= s.grid.length || x < 0 || x >= s.grid[0].length) return "wall";
  return s.grid[y][x];
}
const playerCanEnter = (t) => t !== "wall" && t !== "pit";
const enemyCanEnter = (t) => t === "floor" || t === "crumble";

function chaseStep(s, e) {
  const W = s.grid[0].length, H = s.grid.length;
  const prev = new Array(W * H).fill(-1);
  const start = e.y * W + e.x, goal = s.player.y * W + s.player.x;
  prev[start] = start;
  const q = [start];
  const order = [DIRS.up, DIRS.right, DIRS.down, DIRS.left];
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    if (cur === goal) break;
    const cx = cur % W, cy = (cur / W) | 0;
    for (const d of order) {
      const nx = cx + d.x, ny = cy + d.y, ni = ny * W + nx;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || prev[ni] !== -1) continue;
      if (ni !== goal && !enemyCanEnter(tileAt(s, nx, ny))) continue;
      prev[ni] = cur;
      q.push(ni);
    }
  }
  if (prev[goal] === -1) return null;
  let cur = goal;
  while (prev[cur] !== start) cur = prev[cur];
  return { x: cur % W, y: (cur / W) | 0 };
}

function planIntents(s) {
  const reserved = new Set();
  const k = (x, y) => x + "," + y;
  const blocked = (e, x, y) =>
    !enemyCanEnter(tileAt(s, x, y)) || reserved.has(k(x, y)) ||
    s.enemies.some((o) => o !== e && o.x === x && o.y === y);
  for (const e of s.enemies) {
    let target = null;
    if (e.type === "patrol") {
      if (blocked(e, e.x + e.dx, e.y + e.dy)) { e.dx = -e.dx; e.dy = -e.dy; }
      if (!blocked(e, e.x + e.dx, e.y + e.dy)) target = { x: e.x + e.dx, y: e.y + e.dy };
    } else {
      const t = chaseStep(s, e);
      if (t && !blocked(e, t.x, t.y)) target = t;
    }
    e.intent = target;
    reserved.add(target ? k(target.x, target.y) : k(e.x, e.y));
  }
}

function initState(level) {
  const p = parseLevel(level);
  const s = { grid: p.grid, player: p.player, enemies: p.enemies, turn: 0, status: "playing", cause: "" };
  planIntents(s);
  return s;
}
const cloneState = (s) => JSON.parse(JSON.stringify(s));

function step(prev, action) {
  if (prev.status !== "playing") return null;
  const d = DIRS[action];
  if (!d) return null;
  const nx = prev.player.x + d.x, ny = prev.player.y + d.y;
  if (action !== "wait" && !playerCanEnter(tileAt(prev, nx, ny))) return null;
  const s = cloneState(prev);
  s.turn++;
  const from = s.player;
  if (action !== "wait" && tileAt(s, from.x, from.y) === "crumble") s.grid[from.y][from.x] = "pit";
  s.player = { x: nx, y: ny };
  if (s.enemies.some((e) => e.x === nx && e.y === ny)) { s.status = "dead"; s.cause = "적에게 뛰어들었어요!"; return s; }
  if (tileAt(s, nx, ny) === "exit") { s.status = "won"; return s; }
  for (const e of s.enemies) if (e.intent) { e.x = e.intent.x; e.y = e.intent.y; }
  if (s.enemies.some((e) => e.x === nx && e.y === ny)) { s.status = "dead"; s.cause = "적에게 잡혔어요!"; return s; }
  planIntents(s);
  return s;
}

function solve(level, maxDepth = 80) {
  const key = (s) => JSON.stringify([s.player, s.enemies.map((e) => [e.x, e.y, e.dx, e.dy]), s.grid.flat().join("")]);
  let frontier = [{ s: initState(level), path: [] }];
  const seen = new Set([key(frontier[0].s)]);
  for (let depth = 0; depth < maxDepth && frontier.length; depth++) {
    const next = [];
    for (const { s, path } of frontier) {
      for (const a of ["up", "down", "left", "right", "wait"]) {
        const n = step(s, a);
        if (!n || n.status === "dead") continue;
        if (n.status === "won") return [...path, a];
        const kk = key(n);
        if (seen.has(kk)) continue;
        seen.add(kk);
        next.push({ s: n, path: [...path, a] });
      }
    }
    frontier = next;
  }
  return null;
}

// ---------- 박자 판정 (시간을 인자로 받는 순수 로직) ----------
//  박자 ±GOOD 안 입력 → 즉시 실행 + PERFECT/GOOD, 더 일찍 → 예약(다음 박자에 실행), 입력 없음 → 벌점 없는 대기
function createJudge() {
  const J = {
    COUNT_IN: 3, PERFECT: 0.07, GOOD: 0.16, SCORE: { perfect: 100, good: 60, queued: 30 },
    spb: 0.6, t0: 0, nextBeat: 0, pending: "",
    combo: 0, maxCombo: 0, score: 0, actions: 0, counts: { perfect: 0, good: 0, queued: 0 },
    resetStats() {
      J.combo = 0; J.maxCombo = 0; J.score = 0; J.actions = 0;
      J.counts = { perfect: 0, good: 0, queued: 0 }; J.pending = ""; J.nextBeat = 0;
    },
    resetClock(spb, t0) { J.spb = spb; J.t0 = t0; J.nextBeat = 0; J.pending = ""; },
    beatTime(k) { return J.t0 + k * J.spb; },
    pulse(now) {
      const p = (now - J.t0) / J.spb;
      return p < 0 ? 0 : Math.pow(1 - (p - Math.floor(p)), 4);
    },
    reservedBeat() { return Math.max(J.nextBeat, J.COUNT_IN); },
    hit(kind) {
      J.counts[kind]++; J.actions++; J.score += J.SCORE[kind];
      if (kind === "queued") { J.combo = 0; return; }
      J.combo++; J.maxCombo = Math.max(J.maxCombo, J.combo);
      if (J.combo >= 2) J.score += Math.min(J.combo, 10) * 5;
    },
    advance(now) {
      const events = [];
      for (;;) {
        const k = J.nextBeat;
        if (k < J.COUNT_IN) { if (now >= J.beatTime(k)) { J.nextBeat++; continue; } break; }
        if (J.pending && now >= J.beatTime(k)) {
          const a = J.pending; J.pending = ""; J.nextBeat++; J.hit("queued");
          events.push({ action: a, kind: "queued" }); continue;
        }
        if (now > J.beatTime(k) + J.GOOD) { J.nextBeat++; events.push({ action: "wait", kind: "wait" }); continue; }
        break;
      }
      return events;
    },
    input(action, now) {
      const events = J.advance(now);
      const dt = now - J.beatTime(J.reservedBeat());
      if (J.nextBeat >= J.COUNT_IN && Math.abs(dt) <= J.GOOD) {
        J.pending = ""; J.nextBeat++;
        const kind = Math.abs(dt) <= J.PERFECT ? "perfect" : "good";
        J.hit(kind);
        events.push({ action, kind });
      } else {
        J.pending = action;
      }
      return events;
    },
    rank() {
      const c = J.counts;
      const acc = (c.perfect + c.good * 0.6 + c.queued * 0.3) / (J.actions || 1);
      return acc >= 0.9 ? "S" : acc >= 0.7 ? "A" : acc >= 0.45 ? "B" : "C";
    },
  };
  return J;
}

if (typeof module !== "undefined") module.exports = { LEVELS, DIRS, initState, step, solve, createJudge };
</script>

<script>
// ===================== 3D 화면 · 오디오 · 입력 =====================
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const COLORS = {
    ink: 0x1b1d24, cream: 0xfff1b8, yellow: 0xffd23f, orange: 0xff9f30, white: 0xfffdf0,
    red: 0xff5a6a, purple: 0xb46bff, green: 0x3ee6a0, floorA: 0x3a4180, floorB: 0x434b8f,
    wall: 0x525baa, crumble: 0xa8793f, pit: 0x05060d, exitInner: 0x0b3b2a, bg: 0x0d0f1e,
  };

  const CHORDS = [
    { root: 110.0, notes: [220.0, 261.63, 329.63] }, { root: 87.31, notes: [174.61, 220.0, 261.63] },
    { root: 130.81, notes: [261.63, 329.63, 392.0] }, { root: 98.0, notes: [196.0, 246.94, 293.66] },

  // ---------------------------------------------------------------- 곡 시계
  const J = createJudge();

  const clock = { running: false, start: 0, scheduled: 0 };

  function songNow() {

  }
  const LEAD = 0.25;

  }
  function stopClock() { clock.running = false; }

    for (;;) {

      const t = clock.start + J.beatTime(k);
      if (t >= horizon) break;
      clock.scheduled++;

  // ---------------------------------------------------------------- 3D: 렌더러 · 카메라
  const stageEl = $("stage");
  const canvas = $("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

  renderer.setClearColor(COLORS.bg, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
  const LIGHT_DIR = new THREE.Vector3(0.35, 0.82, 0.45).normalize();   // 왼쪽 앞 위에서 오는 빛
  const CAM_PITCH = THREE.MathUtils.degToRad(52);
  const raycaster = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  // ---------------------------------------------------------------- 셰이더 (툰 4단계 + 잉크 외곽선)
  const TOON_VS = `
    varying vec3 vN; varying vec3 vC;
    void main() {
      vec4 p = vec4(position, 1.0);
      vec3 n = normal;
      vC = vec3(1.0);
      #ifdef USE_INSTANCING
        p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
      #endif
      #ifdef USE_INSTANCING_COLOR
        vC = instanceColor;
      #endif
      vN = normalize(mat3(modelMatrix) * n);
      gl_Position = projectionMatrix * modelViewMatrix * p;
    }`;
  const TOON_FS = `
    uniform vec3 color; uniform vec3 lightDir; uniform float glow;
    varying vec3 vN; varying vec3 vC;
    void main() {
      float nl = clamp(dot(normalize(vN), lightDir) * 0.5 + 0.5, 0.0, 0.999);
      float ramp = 0.44 + floor(nl * 4.0) * 0.17;
      vec3 c = color * vC;
      gl_FragColor = vec4(c * (ramp + glow), 1.0);
    }`;
  const OUTLINE_VS = `
    uniform float width;
    void main() {
      vec4 p = vec4(position + normal * width, 1.0);
      #ifdef USE_INSTANCING
        p = instanceMatrix * p;
      #endif
      gl_Position = projectionMatrix * modelViewMatrix * p;
    }`;
  const OUTLINE_FS = `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`;
  const MARKER_VS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const MARKER_FS = `
    uniform vec3 color; uniform float fill; uniform float border; uniform float dashed; uniform float pulse;
    varying vec2 vUv;
    float rbox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main() {
      vec2 p = vUv * 2.0 - 1.0;
      float d = rbox(p, vec2(0.84), 0.24);
      float inside = 1.0 - smoothstep(-0.03, 0.0, d);
      float ring = smoothstep(-0.2, -0.16, d) * (1.0 - smoothstep(-0.03, 0.0, d));
      float dash = mix(1.0, step(0.0, sin(atan(p.y, p.x) * 12.0)), dashed);
      float a = max(inside * fill, ring * border * dash) * (0.65 + 0.35 * pulse);
      if (a < 0.003) discard;
      gl_FragColor = vec4(color, a);
    }`;
  const BLOB_FS = `varying vec2 vUv; void main() { float d = length(vUv * 2.0 - 1.0); float a = (1.0 - smoothstep(0.55, 1.0, d)) * 0.38; gl_FragColor = vec4(0.0, 0.0, 0.0, a); }`;

  const matCache = new Map();
  function toonMat(color, glow = 0.12) {
    const key = "t" + color + ":" + glow;
    if (!matCache.has(key)) {
      matCache.set(key, new THREE.ShaderMaterial({
        uniforms: { color: { value: new THREE.Color(color) }, lightDir: { value: LIGHT_DIR }, glow: { value: glow } },
        vertexShader: TOON_VS, fragmentShader: TOON_FS,
      }));
    }
    return matCache.get(key);
  }
  function outlineMat(width = 0.024) {
    const key = "o" + width;
    if (!matCache.has(key)) {
      matCache.set(key, new THREE.ShaderMaterial({
        uniforms: { color: { value: new THREE.Color(COLORS.ink) }, width: { value: width } },
        vertexShader: OUTLINE_VS, fragmentShader: OUTLINE_FS, side: THREE.BackSide,
      }));
    }
    return matCache.get(key);
  }
  function markerMat(color, fill = 0.2, border = 1, dashed = false) {
    return new THREE.ShaderMaterial({
      uniforms: {
        color: { value: new THREE.Color(color) }, fill: { value: fill }, border: { value: border },
        dashed: { value: dashed ? 1 : 0 }, pulse: { value: 0 },

      vertexShader: MARKER_VS, fragmentShader: MARKER_FS, transparent: true, depthWrite: false,

  }
  const blobMat = new THREE.ShaderMaterial({ vertexShader: MARKER_VS, fragmentShader: BLOB_FS, transparent: true, depthWrite: false });

  // ---------------------------------------------------------------- 메시: 슈퍼엘립소이드(둥근 상자) · 원뿔
  const geoCache = new Map();
  const spow = (x, e) => Math.sign(x) * Math.pow(Math.abs(x), e);
  function pushTri(idx, P, N, a, b, c) {
    const ax = P[a * 3], ay = P[a * 3 + 1], az = P[a * 3 + 2];
    const ux = P[b * 3] - ax, uy = P[b * 3 + 1] - ay, uz = P[b * 3 + 2] - az;
    const vx = P[c * 3] - ax, vy = P[c * 3 + 1] - ay, vz = P[c * 3 + 2] - az;
    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
    if (fx * fx + fy * fy + fz * fz < 1e-14) return;          // 극점의 찌그러진 삼각형
    const nx = N[a * 3] + N[b * 3] + N[c * 3], ny = N[a * 3 + 1] + N[b * 3 + 1] + N[c * 3 + 1], nz = N[a * 3 + 2] + N[b * 3 + 2] + N[c * 3 + 2];
    if (fx * nx + fy * ny + fz * nz >= 0) idx.push(a, b, c); else idx.push(a, c, b);   // 바깥에서 반시계(앞면)
  }
  function finishGeo(P, N, idx) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(N, 3));
    g.setIndex(idx);
    return g;
  }
  // e=1 타원체, e가 작을수록 상자. 해석적 법선이라 외곽선에 틈이 없다.
  function squircle(sx, sy, sz, e1 = 0.45, e2 = 0.45, lat = 12, lon = 20) {
    const key = ["sq", sx, sy, sz, e1, e2, lat, lon].join(":");
    if (geoCache.has(key)) return geoCache.get(key);
    const a = sx / 2, b = sy / 2, c = sz / 2, P = [], N = [], idx = [];
    for (let i = 0; i <= lat; i++) {
      const v = -Math.PI / 2 + Math.PI * i / lat;
      for (let j = 0; j <= lon; j++) {
        const u = 2 * Math.PI * j / lon;
        const cv = spow(Math.cos(v), e1), sv = spow(Math.sin(v), e1);
        P.push(a * cv * spow(Math.cos(u), e2), b * sv, c * cv * spow(Math.sin(u), e2));
        const ncv = spow(Math.cos(v), 2 - e1);
        let nx = ncv * spow(Math.cos(u), 2 - e2) / a, ny = spow(Math.sin(v), 2 - e1) / b, nz = ncv * spow(Math.sin(u), 2 - e2) / c;
        const l = Math.hypot(nx, ny, nz);
        if (l > 1e-6) { nx /= l; ny /= l; nz /= l; } else { nx = 0; ny = 1; nz = 0; }
        N.push(nx, ny, nz);

      pushTri(idx, P, N, i0, i2, i1);
      pushTri(idx, P, N, i1, i2, i3);

    for (let j = 0; j < seg; j++) {
      const u = 2 * Math.PI * j / seg, cx = Math.cos(u), cz = Math.sin(u);

    P.push(0, 0, 0); N.push(0, -1, 0);
    for (let j = 0; j < seg; j++) {
      const a = 1 + j, b = 1 + (j + 1) % seg;
      pushTri(idx, P, N, 0, a, b);
      pushTri(idx, P, N, base, b, a);
    }
    const g = finishGeo(P, N, idx);
    geoCache.set(key, g);
    return g;
  }
  const flatQuad = (() => { const g = new THREE.PlaneGeometry(0.96, 0.96); g.rotateX(-Math.PI / 2); return g; })();

  // 부품 하나 = 툰 메시 + 잉크 외곽선(같은 지오메트리, 뒷면만 부풀림)
  function part(parent, geo, color, pos, opts = {}) {
    const m = new THREE.Mesh(geo, toonMat(color, opts.glow ?? 0.12));
    m.position.set(pos[0], pos[1], pos[2]);
    if (opts.rotZ) m.rotation.z = opts.rotZ;
    if (opts.outline !== false) m.add(new THREE.Mesh(geo, outlineMat(opts.width ?? 0.024)));
    parent.add(m);
    return m;
  }

  // ---------------------------------------------------------------- 캐릭터
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  class Actor {
    constructor() {
      this.root = new THREE.Group();          // 땅 위 위치
      this.body = new THREE.Group();          // 높이·회전·찌그러짐
      this.root.add(this.body);
      const sh = new THREE.Mesh(flatQuad, blobMat);
      sh.scale.set(0.83, 1, 0.83);
      sh.position.set(0, 0.02, 0.02);

      this.hopHeight = 0.55; this.baseScale = 1;

      this.pulse = 0; this.yaw = 0;
    }
    place(v) { this.root.position.copy(v); }
    hopTo(from, to, dur, now) { this.hop = { from: from.clone(), to: to.clone(), dur, start: now }; this.root.position.copy(from); }
    bump(dir, now) { this.bumpA = { dir, start: now }; }

        hopT = t;
        const s = Math.sin(Math.PI * t);
        h = s * this.hopHeight;
        sy = 1 + 0.2 * s - Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 0.8) / 0.2))) * 0.14;
        if (t >= 1) this.hop = null;
      } else {
        h = 0.05 * this.pulse;
        sy = 1 + 0.05 * this.pulse;

      }

      if (this.special) this.special(now);

    }

  // 노란 유치원 모자를 쓴 병아리 (kong 기본 병아리 느낌을 참고해 새로 만든 모델, Godot 버전과 같은 치수)
  class Chick extends Actor {
    constructor() {
      super();
      this.baseScale = 0.95;
      const b = this.body;
      for (const s of [-1, 1]) part(b, squircle(0.17, 0.07, 0.22, 0.6, 0.6, 8, 12), COLORS.orange, [s * 0.11, 0.035, -0.06]);
      part(b, squircle(0.40, 0.38, 0.35, 0.5, 0.5), COLORS.cream, [0, 0.29, 0]);
      part(b, squircle(0.70, 0.54, 0.58, 0.38, 0.38, 14, 22), COLORS.cream, [0, 0.70, 0]);
      this.wings = [-1, 1].map((s) => {
        const w = new THREE.Group();
        w.position.set(s * 0.24, 0.42, 0);
        b.add(w);
        part(w, squircle(0.10, 0.22, 0.2, 0.7, 0.7, 8, 12), COLORS.cream, [s * 0.02, -0.07, 0]);
        return w;
      });
      for (const s of [-1, 1]) {
        part(b, squircle(0.075, 0.125, 0.05, 0.8, 0.8, 8, 12), COLORS.ink, [s * 0.155, 0.72, -0.285], { outline: false });
        part(b, squircle(0.03, 0.04, 0.02, 1, 1, 6, 8), COLORS.white, [s * 0.155 - 0.012, 0.755, -0.312], { outline: false, glow: 0.3 });
      }
      part(b, squircle(0.15, 0.095, 0.14, 0.8, 0.8, 8, 12), COLORS.orange, [0, 0.645, -0.31]);
      part(b, squircle(0.5, 0.28, 0.5, 0.6, 1.0, 10, 20), COLORS.yellow, [0, 1.03, 0]);
      part(b, squircle(0.86, 0.06, 0.86, 0.3, 1.0, 6, 24), COLORS.yellow, [0, 0.97, 0.02]);
      this.face({ x: 0, y: 1 }, 0, true);
    }
    update(now) {
      const t = super.update(now);
      const flap = t >= 0 ? Math.sin(Math.PI * t) * 0.9 : 0;
      this.wings[0].rotation.z = -flap;
      this.wings[1].rotation.z = flap;
      return t;
    }
    fallOver(now) {
      this.special = (n) => {
        const t = easeOut(Math.min(1, (n - now) / 0.25));
        this.body.rotation.z = t * Math.PI / 2;
        this.body.position.y = t * 0.3;
      };
    }
    celebrate(now) {
      const yaw0 = this.yaw;
      this.special = (n) => {
        const t = Math.min(1, (n - now) / 0.6);
        this.body.rotation.y = yaw0 + easeOut(t) * Math.PI * 2;
        this.body.position.y = Math.sin(Math.PI * Math.min(1, t / 0.85)) * 0.5;
      };
    }
    reset() { this.special = null; this.hop = null; this.bumpA = null; this.face({ x: 0, y: 1 }, 0, true); }
  }

  // 적: 순찰병(빨간 네모) / 추적자(보라 가시공). 눈은 다음에 갈 방향을 본다.
  class Enemy extends Actor {
    constructor(type) {
      super();
      this.hopHeight = 0.3;
      const b = this.body;
      let eyeY = 0.34, eyeZ = -0.3;
      if (type === "patrol") {
        part(b, squircle(0.64, 0.6, 0.62, 0.4, 0.4, 12, 18), COLORS.red, [0, 0.3, 0]);
      } else {
        part(b, squircle(0.56, 0.56, 0.56, 1, 1, 10, 16), COLORS.purple, [0, 0.32, 0]);
        const sp = cone(0.1, 0.2, 7);
        const spike = (d) => {
          const m = part(b, sp, COLORS.purple, [d.x * 0.25, 0.32 + d.y * 0.25, d.z * 0.25]);
          m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
        };
        for (let i = 0; i < 8; i++) {
          const a = Math.PI * 2 * i / 8;
          const d = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));
          if (i !== 0) spike(d);
          if (i % 2 === 1) spike(d.clone().add(new THREE.Vector3(0, 1, 0)).normalize());
        }
        spike(new THREE.Vector3(0, 1, 0));
        eyeY = 0.36; eyeZ = -0.25;
      }
      for (const s of [-1, 1]) {
        part(b, squircle(0.07, 0.12, 0.05, 0.8, 0.8, 8, 12), COLORS.ink, [s * 0.12, eyeY, eyeZ], { outline: false });
        part(b, squircle(0.028, 0.036, 0.02, 1, 1, 6, 8), COLORS.white, [s * 0.12 - 0.01, eyeY + 0.035, eyeZ - 0.027], { outline: false, glow: 0.3 });
        part(b, squircle(0.15, 0.035, 0.03, 0.6, 0.6, 6, 10), COLORS.ink, [s * 0.125, eyeY + 0.1, eyeZ - 0.01], { outline: false, rotZ: THREE.MathUtils.degToRad(22 * s) });
      }
      this.face({ x: 0, y: 1 }, 0, true);
    }
  }

  // ---------------------------------------------------------------- 보드
  const board = {
    group: new THREE.Group(), w: 0, h: 0, crumbles: new Map(), falling: [], intents: new THREE.Group(),
    moveMarkers: {}, waitMarker: null, exitDoor: null, exitGlow: null,
    world(p) { return new THREE.Vector3(p.x - (this.w - 1) / 2, 0, p.y - (this.h - 1) / 2); },
    build(s) {
      scene.remove(this.group);
      this.group = new THREE.Group();
      scene.add(this.group);
      this.crumbles.clear(); this.falling = [];
      this.w = s.grid[0].length; this.h = s.grid.length;
      const floors = [], walls = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const t = s.grid[y][x];
        if (t === "wall") walls.push({ x, y }); else floors.push({ x, y });
      }
      const m4 = new THREE.Matrix4(), col = new THREE.Color();
      const fl = new THREE.InstancedMesh(squircle(0.96, 0.24, 0.96, 0.3, 0.3, 6, 12), toonMat(0xffffff, 0.1), floors.length);
      floors.forEach((p, i) => {
        const v = this.world(p);
        fl.setMatrixAt(i, m4.makeTranslation(v.x, -0.12, v.z));
        fl.setColorAt(i, col.setHex((p.x + p.y) % 2 ? COLORS.floorB : COLORS.floorA));
      });
      const wl = new THREE.InstancedMesh(squircle(0.96, 0.52, 0.96, 0.28, 0.3, 8, 12), toonMat(0xffffff, 0.1), walls.length);
      walls.forEach((p, i) => {
        const v = this.world(p);
        wl.setMatrixAt(i, m4.makeTranslation(v.x, 0.08, v.z));
        wl.setColorAt(i, col.setHex(COLORS.wall));
      });
      this.group.add(fl, wl);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const t = s.grid[y][x], v = this.world({ x, y });
        if (t === "crumble") {
          const m = part(this.group, squircle(0.88, 0.14, 0.88, 0.3, 0.3, 6, 12), COLORS.crumble, [v.x, -0.01, v.z]);
          this.crumbles.set(x + "," + y, m);
        } else if (t === "pit") this.addPit(v);
        else if (t === "exit") this.buildExit(v);
      }
      this.group.add(this.intents = new THREE.Group());
      for (const dir of ["up", "down", "left", "right"]) {
        const m = new THREE.Mesh(flatQuad, markerMat(COLORS.yellow, 0.05, 1));
        m.renderOrder = 2; m.visible = false;
        this.group.add(m);
        this.moveMarkers[dir] = m;
      }
      this.waitMarker = new THREE.Mesh(flatQuad, markerMat(COLORS.green, 0, 1));
      this.waitMarker.scale.set(0.6, 1, 0.6);
      this.waitMarker.renderOrder = 2;
      this.group.add(this.waitMarker);
    },
    addPit(v) { part(this.group, squircle(0.8, 0.04, 0.8, 0.3, 0.3, 4, 12), COLORS.pit, [v.x, 0.02, v.z], { outline: false }); },
    buildExit(v) {
      const g = new THREE.Group();
      g.position.copy(v);
      part(g, squircle(0.58, 0.84, 0.2, 0.5, 0.5, 10, 16), COLORS.green, [0, 0.42, 0], { glow: 0.45 });
      part(g, squircle(0.36, 0.64, 0.06, 0.6, 0.6, 8, 12), COLORS.exitInner, [0, 0.4, 0.1], { outline: false });
      this.group.add(g);
      this.exitDoor = g;
      const glow = new THREE.Mesh(flatQuad, markerMat(COLORS.green, 0.38, 1));
      glow.position.set(v.x, 0.035, v.z);
      glow.renderOrder = 1;
      this.group.add(glow);
      this.exitGlow = glow;
    },
    syncTiles(s, now) {
      for (const [key, m] of this.crumbles) {
        const [x, y] = key.split(",").map(Number);
        if (s.grid[y][x] === "pit") {
          this.crumbles.delete(key);
          this.falling.push({ m, start: now });
          this.addPit(this.world({ x, y }));
        }
      }
    },
    showIntents(s) {
      this.group.remove(this.intents);
      this.intents = new THREE.Group();
      this.group.add(this.intents);
      if (s.status !== "playing") return;
      for (const e of s.enemies) {
        if (!e.intent) continue;
        const color = e.type === "patrol" ? COLORS.red : COLORS.purple;
        const root = new THREE.Group();
        root.position.copy(this.world(e.intent));
        const q = new THREE.Mesh(flatQuad, markerMat(color, 0.22, 1, true));
        q.position.y = 0.035; q.renderOrder = 1;
        root.add(q);
        const d = new THREE.Vector3(e.intent.x - e.x, 0, e.intent.y - e.y).normalize();
        const arrow = new THREE.Mesh(cone(0.13, 0.3, 8), toonMat(color, 0.25));
        arrow.position.set(-d.x * 0.15, 0.1, -d.z * 0.15);
        arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
        root.add(arrow);
        this.intents.add(root);
      }
    },
    showTargets(s, pending, pulse) {
      for (const dir of Object.keys(this.moveMarkers)) {
        const mk = this.moveMarkers[dir], d = DIRS[dir];
        const p = { x: s.player.x + d.x, y: s.player.y + d.y };
        const t = tileAt(s, p.x, p.y);
        const ok = s.status === "playing" && t !== "wall" && t !== "pit";
        mk.visible = ok;
        if (!ok) continue;
        mk.position.copy(this.world(p)).setY(0.04);
        const reserved = pending === dir;
        const danger = s.enemies.some((e) => (e.x === p.x && e.y === p.y) || (e.intent && e.intent.x === p.x && e.intent.y === p.y));
        const u = mk.material.uniforms;
        u.color.value.setHex(reserved ? COLORS.green : danger ? COLORS.red : COLORS.yellow);
        u.fill.value = reserved ? 0.4 : 0.05;
        u.border.value = reserved || !danger ? 1 : 0.4;
        u.pulse.value = reserved ? 1 : pulse;
      }
      this.waitMarker.visible = pending === "wait" && s.status === "playing";
      this.waitMarker.position.copy(this.world(s.player)).setY(0.045);
    },
    update(now, pulse) {
      if (this.exitDoor) this.exitDoor.scale.setScalar(1 + 0.06 * pulse);
      if (this.exitGlow) this.exitGlow.material.uniforms.pulse.value = pulse;
      this.falling = this.falling.filter((f) => {
        const t = (now - f.start) / 0.25;
        f.m.position.y = -0.01 - t * t * 0.5;
        if (t >= 1) { this.group.remove(f.m); return false; }
        return true;
      });
    },
  };

  // ---------------------------------------------------------------- 카메라
  // 따라가기: 병아리 근처에서 화면 가로에 VIEW_TILES칸이 보이게 → 어느 스테이지든 칸 크기(누르는 크기)가 같다.
  // 전체 보기: 맵 전체가 무대에 들어오게 맞춘다(시작 전, 미니맵을 눌렀을 때).
  const VIEW_TILES = 6;
  const MIN_ROWS = 5.5;
  const cam = { tx: 0, tz: 0, d: 20 };
  let overview = true;
  let ov = { tx: 0, tz: 0, d: 20 };

  function placeCamera(tx, tz, d) {
    camera.position.set(tx, Math.sin(CAM_PITCH) * d, tz + Math.cos(CAM_PITCH) * d);
    camera.lookAt(tx, 0, tz);
    camera.updateMatrixWorld(true);
  }
  function resize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = 30;
    camera.updateProjectionMatrix();
    if (board.w) ov = computeOverview();
  }
  function computeOverview() {
    const hw = board.w / 2, hh = board.h / 2;
    const pts = [];
    for (const x of [-hw, hw]) for (const z of [-hh, hh]) for (const y of [0, 0.6]) pts.push(new THREE.Vector3(x, y, z));
    pts.push(new THREE.Vector3(0, 1.1, -hh + 0.5));
    const v = new THREE.Vector3();
    const bounds = () => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of pts) { v.copy(p).project(camera); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
      return { x0, x1, y0, y1 };
    };
    let tz = 0, d = 20;
    for (let iter = 0; iter < 4; iter++) {
      let lo = 2, hi = 120;
      for (let i = 0; i < 28; i++) {
        const mid = (lo + hi) / 2;
        placeCamera(0, tz, mid);
        const b = bounds();
        if (b.x0 > -0.94 && b.x1 < 0.94 && b.y0 > -0.92 && b.y1 < 0.92) hi = mid; else lo = mid;
      }
      d = hi;
      placeCamera(0, tz, d);
      const b = bounds();
      tz -= ((b.y0 + b.y1) / 2) * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.sin(CAM_PITCH);
    }
    placeCamera(cam.tx, cam.tz, cam.d);
    return { tx: 0, tz, d };
  }
  function followTarget() {
    const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), ht = vt * camera.aspect;
    const d = Math.max((VIEW_TILES / 2) / ht, MIN_ROWS * Math.sin(CAM_PITCH) / (2 * vt));
    const halfX = d * ht - 0.3, halfZ = (d * vt) / Math.sin(CAM_PITCH) - 0.3;
    const clampAxis = (v, half, limit) => (limit <= half ? 0 : Math.max(-limit + half, Math.min(limit - half, v)));
    const p = chick.root.position;
    return { tx: clampAxis(p.x, halfX, board.w / 2), tz: clampAxis(p.z, halfZ, board.h / 2), d };
  }
  function updateCamera(dt, snap = false) {
    if (!board.w) return;
    const want = overview ? ov : followTarget();
    const k = snap ? 1 : 1 - Math.exp(-dt * 7);
    cam.tx += (want.tx - cam.tx) * k;
    cam.tz += (want.tz - cam.tz) * k;
    cam.d += (want.d - cam.d) * k;
    placeCamera(cam.tx, cam.tz, cam.d);
  }
  function setOverview(on) {
    overview = on;
    $("mapBtn").classList.toggle("on", on);
    $("mapLabel").textContent = on ? "따라가기" : "전체 맵";
    $("mapBtn").setAttribute("aria-label", on ? "병아리 따라가기" : "전체 맵 보기");
  }

  // 미니맵: 전체 맵 + 적/예고 칸 + 지금 화면에 보이는 영역
  const mctx = $("minimap").getContext("2d");
  const MAP_COLORS = { wall: "#525baa", floor: "#2a2f5c", crumble: "#a8793f", pit: "#05060d", exit: "#3ee6a0" };
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([x, y]) => new THREE.Vector2(x, y));
  function drawMinimap() {
    if (!state) return;
    const W = board.w, H = board.h, mm = $("minimap");
    const cell = Math.max(5, Math.floor(Math.min(108 / W, 96 / H)));
    const cw = W * cell, ch = H * cell, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (mm.width !== cw * dpr || mm.height !== ch * dpr) {
      mm.width = cw * dpr; mm.height = ch * dpr; mm.style.width = cw + "px"; mm.style.height = ch + "px";
    }
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mctx.clearRect(0, 0, cw, ch);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      mctx.fillStyle = MAP_COLORS[state.grid[y][x]] || MAP_COLORS.floor;
      mctx.fillRect(x * cell, y * cell, cell - 1, cell - 1);
    }
    const dot = (x, y, r, color) => { mctx.fillStyle = color; mctx.beginPath(); mctx.arc((x + 0.5) * cell, (y + 0.5) * cell, r, 0, Math.PI * 2); mctx.fill(); };
    for (const e of state.enemies) {
      const c = e.type === "patrol" ? CSS.red : "#b46bff";
      if (e.intent && state.status === "playing") {
        mctx.strokeStyle = c; mctx.lineWidth = 1;
        mctx.strokeRect(e.intent.x * cell + 1.5, e.intent.y * cell + 1.5, cell - 4, cell - 4);
      }
      dot(e.x, e.y, cell * 0.36, c);
    }
    dot(state.player.x, state.player.y, cell * 0.42, "#1b1d24");
    dot(state.player.x, state.player.y, cell * 0.32, CSS.yellow);
    if (!overview) {      // 화면에 보이는 땅 영역(사다리꼴)
      const pts = [];
      for (const c of corners) {
        raycaster.setFromCamera(c, camera);
        const hit = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(ground, hit)) return;
        pts.push([(hit.x + W / 2) * cell, (hit.z + H / 2) * cell]);
      }
      mctx.save();
      mctx.beginPath(); mctx.rect(0, 0, cw, ch); mctx.clip();          // 맵 밖으로 나간 부분은 그리지 않음
      mctx.beginPath(); pts.forEach(([x, y], i) => (i ? mctx.lineTo(x, y) : mctx.moveTo(x, y))); mctx.closePath();
      mctx.fillStyle = "rgba(232,234,255,0.10)"; mctx.fill();
      mctx.strokeStyle = "rgba(232,234,255,0.85)"; mctx.lineWidth = 2; mctx.stroke();
      mctx.restore();
    }
  }

  // ---------------------------------------------------------------- 게임 진행
  const chick = new Chick();
  scene.add(chick.root);
  const enemyViews = new Map();
  let state = null, history = [], levelIdx = 0, rhythm = save.rhythm, phase = "menu", clockStarted = false;
  let lastCount = null;

  const CONTROL_NAME = { swipe: "스와이프", pad: "십자 패드", tap: "칸 탭" };
  const CONTROL_HELP = {
    swipe: "화면 아무 데서나 가고 싶은 방향으로 밀기! 톡 치면 대기.",
    pad: "아래 버튼으로 점프, 가운데 버튼은 대기.",
    tap: "가고 싶은 옆 칸을 탭! 병아리를 탭하면 대기.",
  };
  function applyControlUI() {
    const pad = save.control === "pad";
    $("pad").hidden = !pad;
    $("hint").hidden = pad;
    $("bottomRow").hidden = pad;
    $("padUndo").style.visibility = rhythm ? "hidden" : "visible";
    $("controlBtn").textContent = "조작: " + CONTROL_NAME[save.control];
  }

  function loadStage(i) {
    levelIdx = i;
    const level = LEVELS[i];
    state = initState(level);
    history = [];
    stopClock();
    J.resetStats();
    J.resetClock(60 / level.bpm, LEAD);
    clockStarted = false;
    setOverview(true);
    rebuildViews();
    updateCamera(0, true);
    hideOverlay();
    setCount("", 1, 0);
    $("stageName").textContent = level.name;
    $("stageSub").textContent = rhythm ? `${level.bpm} BPM` : "퍼즐 모드";
    $("hint").textContent = level.hint;
    $("beatbar").hidden = !rhythm;
    $("undoBtn").hidden = rhythm;
    applyControlUI();
    refreshHud();
    if (rhythm) {
      phase = "ready";
      showOverlay("준비됐나요?", CONTROL_HELP[save.control] + "\n박자 전에 미리 입력하면 다음 박자에 자동으로 점프해요.\n아무것도 안 하면 제자리에서 기다려요.",
        [["시작", startRun, true]], CSS.yellow);
    } else {
      phase = "playing";
    }
  }

  function rebuildViews() {
    board.build(state);
    for (const ev of enemyViews.values()) scene.remove(ev.root);
    enemyViews.clear();
    for (const e of state.enemies) {
      const ev = new Enemy(e.type);
      ev.place(board.world(e));
      ev.face(lookOf(e), 0, true);
      scene.add(ev.root);
      enemyViews.set(e.id, ev);
    }
    chick.reset();
    chick.place(board.world(state.player));
    board.showIntents(state);
    resize();
  }

  const lookOf = (e) => (e.intent ? { x: e.intent.x - e.x, y: e.intent.y - e.y } : { x: e.dx, y: e.dy });

  function startRun() {
    if (phase !== "ready" && phase !== "paused") return;
    phase = "playing";
    hideOverlay();
    setOverview(false);          // 카운트다운 동안 병아리 쪽으로 줌인
    J.resetClock(60 / LEVELS[levelIdx].bpm, LEAD);
    startClock(LEVELS[levelIdx].bpm);
    clockStarted = true;
  }

  function restart() {
    const auto = rhythm && clockStarted;
    loadStage(levelIdx);
    if (auto) startRun();
  }

  function openMenu() {
    stopClock();
    if (phase === "playing") phase = "paused";
    hideOverlay();
    renderSelect();
    $("select").hidden = false;
  }

  function pause() {
    if (phase !== "playing" || !rhythm) return;
    phase = "paused";
    stopClock();
    showOverlay("일시정지", "다시 시작하면 카운트다운 후 이어서 진행해요.", [["계속하기", startRun, true], ["메뉴", openMenu]], CSS.yellow);
  }

  function undo() {
    if (rhythm || !history.length || phase === "menu") return;
    state = history.pop();
    phase = "playing";
    hideOverlay();
    rebuildViews();
    refreshHud();
  }

  // 행동 입력(키보드/스와이프/패드/탭 공용). time: 판정에 쓸 곡 시각(스와이프는 손가락이 닿은 순간)
  function act(action, time) {
    if (overlayOpen() && phase !== "ready") return;
    if (phase === "ready") { startRun(); return; }
    if (phase !== "playing") return;
    if (overview && !rhythm) setOverview(false);
    if (rhythm) applyEvents(J.input(action, time ?? songNow()));
    else doStep(action, "puzzle");
  }

  function applyEvents(events) {
    for (const ev of events) {
      if (phase !== "playing") break;
      doStep(ev.action, ev.kind);
    }
  }

  function doStep(action, kind) {
    const now = performance.now() / 1000;
    let next = step(state, action), bumped = false;
    const d = DIRS[action];
    if (!next) {
      if (!rhythm) { chick.bump(d, now); return; }
      bumped = true;
      next = step(state, "wait");
    }
    const prev = state;
    history.push(prev);
    state = next;
    const dur = rhythm ? Math.min(0.17, J.spb * 0.35) : 0.19;
    if (action !== "wait") chick.face(d, now);
    if (bumped) chick.bump(d, now);
    else if (action !== "wait") chick.hopTo(board.world(prev.player), board.world(state.player), dur, now);
    state.enemies.forEach((e, i) => {
      const pe = prev.enemies[i], ev = enemyViews.get(e.id);
      if (pe.x !== e.x || pe.y !== e.y) ev.hopTo(board.world(pe), board.world(e), dur, now);
      ev.face(lookOf(e), now);
    });
    board.syncTiles(state, now);
    board.showIntents(state);
    if (kind === "perfect") { showJudge("PERFECT", CSS.yellow); sfx("perfect"); }
    else if (kind === "good") { showJudge("GOOD", CSS.green); sfx("good"); }
    refreshHud();
    if (state.status !== "playing") finish(dur);
  }

  function finish(animDur) {
    const status = state.status;
    phase = status;
    stopClock();
    sfx(status === "won" ? "won" : "dead");
    if (status === "won") {
      const rank = rhythm ? J.rank() : "S";
      if (!save.cleared.includes(levelIdx)) save.cleared.push(levelIdx);
      const order = "SABC", prevRank = save.best[levelIdx];
      if (!prevRank || order.indexOf(rank) < order.indexOf(prevRank)) save.best[levelIdx] = rank;
      persist();
    }
    setTimeout(() => {
      const now = performance.now() / 1000;
      if (status === "won") chick.celebrate(now); else chick.fallOver(now);
    }, animDur * 1000);
    setTimeout(() => { if (phase === status) showResult(status); }, animDur * 1000 + 700);
  }

  function showResult(status) {
    const last = levelIdx >= LEVELS.length - 1;
    if (status === "won") {
      let sub = `${state.turn}턴 만에 탈출했어요.`;
      if (rhythm) {
        const c = J.counts;
        sub = `랭크 ${J.rank()}   점수 ${J.score}\nPERFECT ${c.perfect}   GOOD ${c.good}   예약 ${c.queued}   최대 콤보 ${J.maxCombo}`;
      }
      if (last) sub += "\n모든 스테이지 클리어!";
      const buttons = [];
      if (!last) buttons.push(["다음 스테이지 →", nextStage, true]);
      buttons.push(["다시하기", restart, last], ["메뉴", openMenu]);
      showOverlay("탈출 성공!", sub, buttons, CSS.green);
    } else {
      const buttons = [["다시하기", restart, true], ["메뉴", openMenu]];
      if (!rhythm) buttons.unshift(["한 턴 되돌리기", undo]);
      showOverlay("실패", state.cause, buttons, CSS.red);
    }
  }

  function nextStage() {
    const go = rhythm;
    loadStage(levelIdx + 1);
    if (go) startRun();
  }

  // ---------------------------------------------------------------- UI
  function refreshHud() {
    $("score").textContent = rhythm ? J.score : `턴 ${state.turn}`;
    $("info").textContent = rhythm ? `콤보 ${J.combo}  /  턴 ${state.turn}` : "";
  }
  function showJudge(text, color) {
    const el = $("judge");
    el.textContent = text;
    el.style.color = color;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }
  function setCount(text, scale, alpha) {
    const el = $("count");
    if (text !== lastCount) { el.textContent = text; el.style.color = text === "GO!" ? CSS.yellow : "#ffffff"; lastCount = text; }
    el.style.opacity = text ? alpha : 0;
    el.style.transform = `scale(${scale})`;
  }
  function showOverlay(title, sub, buttons, color) {
    $("ovTitle").textContent = title;
    $("ovTitle").style.color = color || "";
    $("ovSub").textContent = sub;
    $("ovSub").hidden = !sub;
    const box = $("ovButtons");
    box.innerHTML = "";
    for (const [label, fn, primary] of buttons) {
      const b = document.createElement("button");
      b.className = "btn" + (primary ? " primary" : "");
      b.textContent = label;
      b.addEventListener("click", fn);
      box.appendChild(b);
    }
    $("overlay").hidden = false;
  }
  function hideOverlay() { $("overlay").hidden = true; }
  const overlayOpen = () => !$("overlay").hidden || !$("select").hidden;

  function renderSelect() {
    const box = $("stages");
    box.innerHTML = "";
    LEVELS.forEach((lv, i) => {
      const b = document.createElement("button");
      b.className = "btn" + (i === levelIdx ? " primary" : "");
      b.innerHTML = `<span>${i + 1}</span>` + (save.cleared.includes(i) ? `<span class="rank">★ ${save.best[i] || ""}</span>` : "");
      b.setAttribute("aria-label", lv.name);
      b.addEventListener("click", () => { $("select").hidden = true; loadStage(i); });
      box.appendChild(b);
    });
    $("modeBtn").textContent = rhythm ? "리듬 모드" : "퍼즐 모드 (박자 없음)";
    $("offset").textContent = `${save.offsetMs >= 0 ? "+" : ""}${save.offsetMs} ms`;
  }

  // 박자 바: 양쪽 막대가 가운데 링으로 다가오고, 링에 닿는 순간이 박자. 예약된 박자는 초록.
  const bctx = $("beatbar").getContext("2d");
  function drawBeatBar(pulse) {
    const cv = $("beatbar");
    if (cv.hidden) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, w, h);
    const rr = (x, y, ww, hh, r) => { bctx.beginPath(); bctx.roundRect ? bctx.roundRect(x, y, ww, hh, r) : bctx.rect(x, y, ww, hh); };
    bctx.fillStyle = CSS.panel; rr(0, 0, w, h, 16); bctx.fill();
    const cx = w / 2, cy = h / 2;
    if (clock.running && phase === "playing") {
      const now = songNow(), gap = Math.min(w * 0.2, 90), resK = J.reservedBeat();
      for (let k = J.nextBeat; k < J.nextBeat + 5; k++) {
        const dx = (J.beatTime(k) - now) / J.spb * gap;
        if (dx > cx || dx < -gap * 0.5) continue;
        bctx.globalAlpha = Math.max(0, Math.min(1, 1 - Math.abs(dx) / cx + 0.25));
        bctx.fillStyle = k < J.COUNT_IN ? CSS.muted : (J.pending && k === resK ? CSS.green : CSS.yellow);
        for (const s of [-1, 1]) { rr(cx + s * dx - 4, cy - 15, 8, 30, 4); bctx.fill(); }
      }
      bctx.globalAlpha = 1;
    } else {
      bctx.fillStyle = CSS.muted;
      bctx.font = "16px Jua, sans-serif";
      bctx.textAlign = "center"; bctx.textBaseline = "middle";
      bctx.fillText(phase === "ready" ? "시작을 누르면 박자가 나와요" : "", cx + w * 0.27, cy);
    }
    bctx.fillStyle = `rgba(255,210,63,${0.14 + pulse * 0.5})`;
    bctx.beginPath(); bctx.arc(cx, cy, 13, 0, Math.PI * 2); bctx.fill();
    bctx.strokeStyle = CSS.yellow; bctx.lineWidth = 3;
    bctx.beginPath(); bctx.arc(cx, cy, 16 + pulse * 4, 0, Math.PI * 2); bctx.stroke();
  }

  // ---------------------------------------------------------------- 입력
  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right", " ": "wait", ".": "wait",
  };
  window.addEventListener("keydown", (e) => {
    if (e.repeat) { if (e.key in KEYS) e.preventDefault(); return; }
    if (e.key in KEYS) { e.preventDefault(); act(KEYS[e.key]); return; }
    if (e.key === "r" || e.key === "R") restart();
    else if (e.key === "z" || e.key === "Z") undo();
    else if (e.key === "Escape") pause();
  });
  // 보드 탭: 병아리 기준 방향. 병아리를 누르면 대기. (손가락이 닿는 순간 판정)
  const ndc = new THREE.Vector2();
  function tap(clientX, clientY) {
    if (phase !== "playing" && phase !== "ready") return;
    const r = canvas.getBoundingClientRect();
    ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(ground, hit)) return;
    const pw = board.world(state.player);
    const rx = hit.x - pw.x, rz = hit.z - pw.z;
    if (Math.abs(rx) < 0.5 && Math.abs(rz) < 0.5) act("wait");
    else if (Math.abs(rx) > Math.abs(rz)) act(rx > 0 ? "right" : "left");
    else act(rz > 0 ? "down" : "up");
  }
  // 스와이프: 손가락이 닿은 순간 = 판정 시각, 18px 움직인 순간 = 방향 확정(손을 뗄 때까지 기다리지 않음). 움직이지 않고 떼면 대기.
  const appEl = $("app");
  const SWIPE_PX = 18;
  const swipe = { id: null, x: 0, y: 0, t: 0, wall: 0, decided: false };
  appEl.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, .layer")) return;
    if (save.control === "tap") {
      if (e.target === canvas) { e.preventDefault(); tap(e.clientX, e.clientY); }
      return;
    }
    if (swipe.id !== null || (phase !== "playing" && phase !== "ready")) return;
    e.preventDefault();
    Object.assign(swipe, { id: e.pointerId, x: e.clientX, y: e.clientY, t: songNow(), wall: performance.now(), decided: false });
    try { appEl.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저 */ }
  });
  appEl.addEventListener("pointermove", (e) => {
    if (e.pointerId !== swipe.id || swipe.decided) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.hypot(dx, dy) < SWIPE_PX) return;
    swipe.decided = true;
    act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"), swipe.t);
  });
  const endSwipe = (e, cancelled) => {
    if (e.pointerId !== swipe.id) return;
    if (!swipe.decided && !cancelled) act("wait", swipe.t);
    swipe.id = null;
  };
  appEl.addEventListener("pointerup", (e) => endSwipe(e, false));
  appEl.addEventListener("pointercancel", (e) => endSwipe(e, true));
  // 방향을 아직 못 정한 손가락이 있으면 그 박자가 "대기"로 넘어가지 않게 잠깐 붙잡아 둔다(최대 0.3초)
  const swipeHold = () => swipe.id !== null && !swipe.decided && performance.now() - swipe.wall < 300;

  // 십자 패드: 누르는 순간 판정
  document.querySelectorAll("#pad [data-act]").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); act(b.dataset.act); }));
  $("padMenu").addEventListener("click", () => openMenu());
  $("padRestart").addEventListener("click", () => restart());
  $("padUndo").addEventListener("click", () => undo());
  $("controlBtn").addEventListener("click", () => {
    const order = ["pad", "swipe", "tap"];
    save.control = order[(order.indexOf(save.control) + 1) % order.length];
    persist();
    applyControlUI();
  });
  $("pauseBtn").addEventListener("click", pause);
  $("menuBtn").addEventListener("click", openMenu);
  $("restartBtn").addEventListener("click", restart);
  $("undoBtn").addEventListener("click", undo);
  $("modeBtn").addEventListener("click", () => {
    rhythm = !rhythm; save.rhythm = rhythm; persist();
    loadStage(levelIdx); openMenu();
  });
  const changeOffset = (dms) => { save.offsetMs = Math.max(-300, Math.min(300, save.offsetMs + dms)); persist(); renderSelect(); };
  $("offMinus").addEventListener("click", () => changeOffset(-10));
  $("offPlus").addEventListener("click", () => changeOffset(10));
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  new ResizeObserver(() => resize()).observe(stageEl);
  $("mapBtn").addEventListener("click", () => setOverview(!overview));

  // ---------------------------------------------------------------- 매 프레임
  let lastFrame = performance.now() / 1000;
  function frame() {
    const now = performance.now() / 1000;
    const dt = Math.min(0.1, now - lastFrame);
    lastFrame = now;
    let pulse = 0;
    if (phase === "playing" && rhythm && clock.running) {
      scheduleAudio();
      const t = songNow();
      applyEvents(J.advance(swipeHold() ? Math.min(t, swipe.t) : t));
      pulse = J.pulse(t);
      const p = (t - J.t0) / J.spb, c = Math.floor(p);
      if (p >= 0 && c <= J.COUNT_IN) {
        const f = p - c;
        setCount(c === J.COUNT_IN ? "GO!" : String(J.COUNT_IN - c), 1 + (1 - f) * 0.25, 1 - f * f);
      } else setCount("", 1, 0);
    } else if (phase !== "playing") {
      pulse = 0.5 + 0.5 * Math.sin(now * 3.3);
    }
    const idle = phase === "playing" || phase === "ready" || phase === "menu";
    chick.pulse = idle ? pulse : 0;
    chick.update(now);
    for (const ev of enemyViews.values()) { ev.pulse = idle ? pulse : 0; ev.update(now); }
    board.update(now, pulse);
    board.showTargets(state, rhythm && phase === "playing" ? J.pending : "", pulse);
    drawBeatBar(pulse);
    updateCamera(dt);
    drawMinimap();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // 자동 테스트용 훅
  window.__game = {
    J, fake, act, tap, get state() { return state; }, get phase() { return phase; }, loadStage, startRun, restart, undo,
    setRhythm(v) { rhythm = v; }, world: (p) => board.world(p), camera, canvas,
    get overview() { return overview; }, setOverview, settle() { updateCamera(0, true); },
    setControl(c) { save.control = c; applyControlUI(); }, get control() { return save.control; },
    project(p) { const v = board.world(p).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
    tick(t) { fake.t = t; applyEvents(J.advance(songNow())); },
  };

  loadStage(0);
  openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
