<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0d0f1e;
    --panel: #171a33;
    --text: #e8eaff;
    --muted: #8b90b8;
    --accent: #ffd34d;
    --danger: #ff5a6a;
    --exit: #3ee6a0;
    --chaser: #b46bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Jua", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 24px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  .stats { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .stage-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .stage-bar button {
    width: 34px; height: 30px; border-radius: 8px; border: 1px solid #2c3160;
    background: var(--panel); color: var(--muted); font-weight: 600; cursor: pointer;
  }
  .stage-bar button.current { border-color: var(--accent); color: var(--accent); }
  .stage-bar button.cleared::after { content: "✓"; font-size: 10px; margin-left: 1px; color: var(--exit); }
  .info { background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  .info .name { font-weight: 700; }
  .info .hint { color: var(--muted); font-size: 14px; margin-top: 2px; line-height: 1.4; }
  .board-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
  canvas { display: block; border-radius: 12px; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(8, 9, 20, 0.72); border-radius: 12px; text-align: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay .title { font-size: 28px; font-weight: 800; }
  .overlay .sub { color: var(--muted); }
  .overlay .row { display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 15px; font-weight: 700;
    background: #2a2f5c; color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #231c00; }
  .beat-wrap { display: flex; justify-content: center; }
  #beatbar { border-radius: 12px; }
  .toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .toolbar .btn { padding: 8px 12px; font-size: 14px; }
  .pad {
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 56px);
    gap: 6px; justify-content: center; margin-top: 4px;
  }
  .pad button {
    border: none; border-radius: 12px; background: var(--panel); color: var(--text);
    font-size: 22px; cursor: pointer;
  }
  .pad button:active { background: #2a2f5c; }
  .pad .wait { font-size: 13px; font-weight: 700; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .keys { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  kbd { background: var(--panel); border: 1px solid #2c3160; border-radius: 4px; padding: 0 5px; font-family: inherit; }
</style>

<body>

  </div>
  <div class="keys">
    <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> 점프 · <kbd>Space</kbd> 제자리 대기 · <kbd>R</kbd> 다시하기 · <kbd>Z</kbd> 되돌리기(퍼즐 모드)<br>
    🎵 리듬 모드: 노란 막대가 가운데 원에 닿는 순간 입력! 놓치면 제자리에 멈추고 적은 움직여요.<br>
    모바일: 보드를 스와이프(탭 = 대기)하거나 아래 버튼 사용
  </div>

<script id="logic">
// ===================== 게임 로직 (렌더링과 분리) =====================
// 맵 기호: # 벽  . 바닥  ~ 무너지는 발판  P 플레이어  E 출구
//          > < v ^ 순찰병(초기 진행 방향)  C 추적자
const LEVELS = [
  {
    name: "1. 첫 점프",
    bpm: 84,
    hint: "방향키로 한 칸씩 점프해서 초록색 출구까지 가세요. 리듬 모드에선 박자에 맞춰서!",
    map: [
      "#######",
      "#P....#",
      "#.###.#",
      "#.#E..#",
      "#.###.#",
      "#.....#",
      "#######",
    ],
  },
  {
    name: "2. 순찰병",
    bpm: 90,
    hint: "빨간 점선 칸은 적이 다음 박자에 올 자리예요. 피하거나 Space로 한 박자 기다리세요.",
    map: [
      "#########",
      "#P......#",
      "#.#####.#",
      "#...<...#",
      "#.#####.#",
      "#......E#",
      "#########",
    ],
  },
  {
    name: "3. 엇갈리는 길",
    bpm: 96,
    hint: "순찰병 둘이 길을 가로막아요. 타이밍을 보고 사이로 빠져나가세요.",
    map: [
      "#########",
      "#P..#...#",
      "#.#.v.#.#",
      "#.......#",
      "#.#.#.#.#",
      "#...^...#",
      "###.#.#.#",
      "#E......#",
      "#########",
    ],
  },
  {
    name: "4. 추적자",
    bpm: 96,
    hint: "보라색 추적자는 한 박자 늦게 당신을 쫓아와요. 기둥을 돌아 따돌리세요.",
    map: [
      "#########",
      "#P......#",
      "#.##.##.#",
      "#...C...#",
      "#.##.##.#",
      "#.......#",
      "#.##.##.#",
      "#......E#",
      "#########",
    ],
  },
  {
    name: "5. 무너지는 다리",
    bpm: 100,
    hint: "갈색 발판은 밟고 떠나면 무너져요. 적은 구멍을 건널 수 없어요.",
    map: [
      "###########",
      "#P..#.....#",
      "#...#.###.#",
      "#...~.#E#.#",
      "#C..#.#...#",
      "###########",
    ],
  },
  {
    name: "6. 탈출",
    bpm: 104,
    hint: "지금까지 배운 걸 모두 써서 탈출하세요!",
    map: [
      "###########",
      "#P....#...#",
      "#.###.#.#.#",
      "#.....~.#E#",
      "#.#.#.#.#.#",
      "#..C..#>..#",
      "###########",
    ],
  },
];

const DIRS = {
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
  left: { x: -1, y: 0 },
  right: { x: 1, y: 0 },
  wait: { x: 0, y: 0 },
};

function parseLevel(level) {
  const grid = [];
  const enemies = [];
  let player = null;
  level.map.forEach((row, y) => {
    const r = [];
    [...row].forEach((ch, x) => {
      let t = "floor";
      if (ch === "#") t = "wall";
      else if (ch === "~") t = "crumble";
      else if (ch === "E") t = "exit";
      else if (ch === "P") player = { x, y };
      else if (ch === ">") enemies.push({ type: "patrol", x, y, dx: 1, dy: 0 });
      else if (ch === "<") enemies.push({ type: "patrol", x, y, dx: -1, dy: 0 });
      else if (ch === "v") enemies.push({ type: "patrol", x, y, dx: 0, dy: 1 });
      else if (ch === "^") enemies.push({ type: "patrol", x, y, dx: 0, dy: -1 });
      else if (ch === "C") enemies.push({ type: "chaser", x, y, dx: 0, dy: 0 });
      r.push(t);
    });
    grid.push(r);
  });
  return { grid, player, enemies: enemies.map((e, id) => ({ ...e, id, intent: null })) };
}

function tileAt(s, x, y) {
  if (y < 0 || y >= s.grid.length || x < 0 || x >= s.grid[0].length) return "wall";
  return s.grid[y][x];
}
const playerCanEnter = (t) => t !== "wall" && t !== "pit";
const enemyCanEnter = (t) => t === "floor" || t === "crumble";

// 추적자: BFS로 플레이어까지 최단 경로의 첫 칸
function chaseStep(s, e) {
  const W = s.grid[0].length, H = s.grid.length;
  const prev = new Array(W * H).fill(-1);
  const start = e.y * W + e.x, goal = s.player.y * W + s.player.x;
  prev[start] = start;
  const q = [start];
  const order = [DIRS.up, DIRS.right, DIRS.down, DIRS.left];
  while (q.length) {
    const cur = q.shift();
    if (cur === goal) break;
    const cx = cur % W, cy = (cur / W) | 0;
    for (const d of order) {
      const nx = cx + d.x, ny = cy + d.y, ni = ny * W + nx;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || prev[ni] !== -1) continue;
      if (ni !== goal && !enemyCanEnter(tileAt(s, nx, ny))) continue;
      prev[ni] = cur;
      q.push(ni);
    }
  }
  if (prev[goal] === -1) return null;
  let cur = goal;
  while (prev[cur] !== start) cur = prev[cur];
  return { x: cur % W, y: (cur / W) | 0 };
}

// 각 적의 "다음 턴 이동"을 미리 확정 (화면에 예고됨)
function planIntents(s) {
  const reserved = new Set();
  const k = (x, y) => x + "," + y;
  const blocked = (e, x, y) =>
    !enemyCanEnter(tileAt(s, x, y)) ||
    reserved.has(k(x, y)) ||
    s.enemies.some((o) => o !== e && o.x === x && o.y === y);
  for (const e of s.enemies) {
    let target = null;
    if (e.type === "patrol") {
      if (blocked(e, e.x + e.dx, e.y + e.dy)) { e.dx = -e.dx; e.dy = -e.dy; }
      if (!blocked(e, e.x + e.dx, e.y + e.dy)) target = { x: e.x + e.dx, y: e.y + e.dy };
    } else if (e.type === "chaser") {
      const t = chaseStep(s, e);
      if (t && !blocked(e, t.x, t.y)) target = t;
    }
    e.intent = target;
    reserved.add(target ? k(target.x, target.y) : k(e.x, e.y));
  }
}

function initState(level) {
  const p = parseLevel(level);
  const s = { grid: p.grid, player: p.player, enemies: p.enemies, turn: 0, status: "playing", cause: "" };
  planIntents(s);
  return s;
}

const cloneState = (s) => JSON.parse(JSON.stringify(s));

// 한 턴 진행: 플레이어 점프 → 적 이동 → 다음 예고 계산. 불가능한 이동이면 null.
function step(prev, action) {
  if (prev.status !== "playing") return null;
  const d = DIRS[action];
  if (!d) return null;
  const nx = prev.player.x + d.x, ny = prev.player.y + d.y;
  if (action !== "wait" && !playerCanEnter(tileAt(prev, nx, ny))) return null;

  const s = cloneState(prev);
  s.turn++;
  const from = s.player;
  if (action !== "wait" && tileAt(s, from.x, from.y) === "crumble") s.grid[from.y][from.x] = "pit";
  s.player = { x: nx, y: ny };

  if (s.enemies.some((e) => e.x === nx && e.y === ny)) {
    s.status = "dead"; s.cause = "적에게 뛰어들었어요!";
    return s;
  }
  if (tileAt(s, nx, ny) === "exit") { s.status = "won"; return s; }

  for (const e of s.enemies) if (e.intent) { e.x = e.intent.x; e.y = e.intent.y; }
  if (s.enemies.some((e) => e.x === nx && e.y === ny)) {
    s.status = "dead"; s.cause = "적에게 잡혔어요!";
    return s;
  }
  planIntents(s);
  return s;
}

// 레벨 검증용: 최소 턴 수 탐색 (BFS)
function solve(level, maxDepth = 80) {
  const key = (s) => JSON.stringify([s.player, s.enemies.map((e) => [e.x, e.y, e.dx, e.dy]), s.grid.flat().join("")]);
  let frontier = [{ s: initState(level), path: [] }];
  const seen = new Set([key(frontier[0].s)]);
  for (let depth = 0; depth < maxDepth && frontier.length; depth++) {
    const next = [];
    for (const { s, path } of frontier) {
      for (const a of ["up", "down", "left", "right", "wait"]) {
        const n = step(s, a);
        if (!n || n.status === "dead") continue;
        if (n.status === "won") return [...path, a];
        const kk = key(n);
        if (seen.has(kk)) continue;
        seen.add(kk);
        next.push({ s: n, path: [...path, a] });
      }
    }
    frontier = next;
  }
  return null;
}

if (typeof module !== "undefined") module.exports = { LEVELS, initState, step, solve };
</script>

<script>
// ===================== 렌더링 · 리듬 · 입력 =====================
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const beatCanvas = document.getElementById("beatbar");
  const bctx = beatCanvas.getContext("2d");
  const $ = (id) => document.getElementById(id);

  const store = {
    get(k, d) { try { const v = localStorage.getItem("rythmnescape." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("rythmnescape." + k, JSON.stringify(v)); } catch {} },
  };

  let mode = store.get("mode", "rhythm");   // "rhythm" | "puzzle"
  let levelIndex = 0;
  let state, history;
  let anim = null;          // { from, to, start, dur }
  let queued = null;
  let tile = 48;
  let facing = { x: 0, y: 1 };
  let bumpInfo = null;
  let cleared = new Set(store.get("cleared", []));
  let exitPulse = 0.5;

  const COLORS = {
    floorA: "#1b1f3d", floorB: "#20254a", wallTop: "#3b4175", wallSide: "#272b52",
    exit: "#3ee6a0", crumble: "#8a6a3c", crumbleLine: "#4d3a1f", pit: "#05060d",
    player: "#ffd23f", patrol: "#ff5a6a", chaser: "#b46bff", intent: "rgba(255,90,106,0.22)",
  };

  // ===================== 오디오 (Web Audio로 직접 합성) =====================
  const audio = { ctx: null, master: null, noise: null };
  function ensureAudio() {
    if (!audio.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.45;
      audio.master.connect(audio.ctx.destination);
      const len = audio.ctx.sampleRate * 0.5;
      audio.noise = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
      const d = audio.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audio.ctx.state === "suspended") audio.ctx.resume();
  }
  function env(t, vol, attack, decay) {
    const g = audio.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(audio.master);
    return g;
  }
  function tone(t, freq, dur, type = "triangle", vol = 0.2, slideTo) {
    const o = audio.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    o.connect(env(t, vol, 0.005, dur));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, filterType, freq) {
    const src = audio.ctx.createBufferSource();
    src.buffer = audio.noise;
    const f = audio.ctx.createBiquadFilter();
    f.type = filterType; f.frequency.value = freq;
    src.connect(f); f.connect(env(t, vol, 0.002, dur));
    src.start(t); src.stop(t + dur + 0.05);
  }
  const kick = (t) => tone(t, 150, 0.16, "sine", 0.9, 45);
  const snare = (t) => { noise(t, 0.12, 0.28, "bandpass", 1800); tone(t, 220, 0.06, "triangle", 0.12, 160); };
  const hat = (t, v = 0.12) => noise(t, 0.035, v, "highpass", 7000);

  // 4마디 코드 진행 (Am - F - C - G)
  const CHORDS = [
    { root: 110.0, notes: [220.0, 261.63, 329.63] },
    { root: 87.31, notes: [174.61, 220.0, 261.63] },
    { root: 130.81, notes: [261.63, 329.63, 392.0] },
    { root: 98.0, notes: [196.0, 246.94, 293.66] },
  ];
  // b: 플레이 가능한 박자 번호(0부터)
  function playMusic(b, t, spb) {
    const chord = CHORDS[Math.floor(b / 4) % 4];
    const inBar = b % 4;
    kick(t);
    if (inBar % 2 === 1) snare(t);
    hat(t + spb / 2, 0.1);
    hat(t, 0.05);
    tone(t, inBar === 2 ? chord.root * 2 : chord.root, spb * 0.45, "triangle", 0.28);
    if (inBar === 0 || inBar === 2) for (const n of chord.notes) tone(t, n, 0.14, "square", 0.025);
    // 짝수 마디마다 오프비트 멜로디
    if (Math.floor(b / 4) % 2 === 1) tone(t + spb / 2, chord.notes[(b * 2) % 3] * 2, 0.1, "triangle", 0.06);
  }
  const countClick = (t, hi) => tone(t, hi ? 1320 : 880, 0.06, "square", 0.08);
  function sting(kind) {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime + 0.02;
    if (kind === "won") [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(t + i * 0.08, f, 0.22, "triangle", 0.2));
    else { tone(t, 330, 0.5, "sawtooth", 0.12, 80); noise(t, 0.25, 0.2, "lowpass", 900); }
  }
  const latency = () => (audio.ctx && (audio.ctx.outputLatency || audio.ctx.baseLatency)) || 0;

  // ===================== 리듬 클록 =====================
  const COUNT_IN = 3;       // 3, 2, 1 다음 박자부터 입력 (GO!)
  const PERFECT = 0.06;     // 초
  const GOOD = 0.13;
  const R = {
    running: false, started: false, t0: 0, spb: 0.6, nextBeat: 0, scheduled: 0, locked: new Set(),
    combo: 0, maxCombo: 0, counts: { perfect: 0, good: 0, miss: 0 }, judge: null,
  };
  const beatTime = (k) => R.t0 + k * R.spb;
  const songNow = () => (audio.ctx ? audio.ctx.currentTime - latency() : 0);

  function resetRhythm() {
    R.running = false; R.started = false;
    R.combo = 0; R.maxCombo = 0; R.counts = { perfect: 0, good: 0, miss: 0 }; R.judge = null;
  }
  function startClock() {
    ensureAudio();
    R.spb = 60 / LEVELS[levelIndex].bpm;
    R.t0 = audio.ctx.currentTime + 0.25;
    R.nextBeat = 0; R.scheduled = 0; R.locked = new Set();
    R.running = true; R.started = true;
    $("overlay").classList.remove("show");
  }
  function scheduler() {
    while (beatTime(R.scheduled) < audio.ctx.currentTime + 0.15) {
      const k = R.scheduled++, t = beatTime(k);
      if (k < COUNT_IN) countClick(t, false);
      else playMusic(k - COUNT_IN, t, R.spb);
    }
  }
  function judge(text, color) { R.judge = { text, color, start: performance.now() }; }
  function hit(kind) {
    R.counts[kind]++;
    if (kind === "miss") { R.combo = 0; judge("MISS", COLORS.patrol); }
    else {
      R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo);
      judge(kind === "perfect" ? "PERFECT" : "GOOD", kind === "perfect" ? COLORS.player : COLORS.exit);
    }
  }
  // 입력 없이 박자가 지나감 → 제자리 대기 + MISS
  function catchUp() {
    const now = songNow();
    while (R.running && now > beatTime(R.nextBeat) + GOOD) {
      const k = R.nextBeat++;
      if (k < COUNT_IN) continue;
      if (!R.locked.has(k)) hit("miss");
      doStep("wait", true);
    }
  }
  function rhythmInput(action) {
    if (state.status !== "playing") return;
    if (!R.running) { startClock(); return; }
    catchUp();
    if (!R.running) return;
    const k = R.nextBeat;
    if (k < COUNT_IN || R.locked.has(k)) return;
    const dt = songNow() - beatTime(k);
    if (Math.abs(dt) <= GOOD) {
      R.nextBeat++;
      hit(Math.abs(dt) <= PERFECT ? "perfect" : "good");
      doStep(action, true);
    } else {
      // 박자보다 너무 일찍 누름 → 이번 박자는 헛디딤 (제자리)
      hit("miss");
      R.judge.text = "너무 빨라요";
      R.locked.add(k);
    }
  }

  // ===================== 게임 진행 =====================
  function load(i) {
    levelIndex = i;
    $("overlay").classList.remove("show");
    state = initState(LEVELS[i]);
    history = [];
    anim = null; queued = null; bumpInfo = null; facing = { x: 0, y: 1 };
    resetRhythm();
    $("stageName").textContent = LEVELS[i].name + (mode === "rhythm" ? `  ♪ ${LEVELS[i].bpm} BPM` : "");
    $("stageHint").textContent = LEVELS[i].hint;
    $("modeBtn").textContent = mode === "rhythm" ? "🎵 리듬 모드" : "🧩 퍼즐 모드";
    $("undoBtn").style.display = mode === "rhythm" ? "none" : "";
    renderStageBar();
    resize();
    updateUI();
    if (mode === "rhythm") showOverlay("준비됐나요?", "박자에 맞춰 점프하세요. 박자를 놓치면 제자리에 멈추고 적은 움직여요.",
      [["▶ 시작 (Space)", startClock, true]], COLORS.player);
  }

  function restart() {
    const autoStart = mode === "rhythm" && R.started;
    load(levelIndex);
    if (autoStart) startClock();
  }

  function renderStageBar() {
    const bar = $("stageBar");
    bar.innerHTML = "";
    LEVELS.forEach((_, i) => {
      const b = document.createElement("button");
      b.textContent = i + 1;
      if (i === levelIndex) b.classList.add("current");
      if (cleared.has(i)) b.classList.add("cleared");
      b.onclick = () => load(i);
      bar.appendChild(b);
    });
  }

  function resize() {
    const W = state.grid[0].length, H = state.grid.length;
    const maxW = $("boardWrap").clientWidth;
    const maxH = Math.max(240, window.innerHeight * 0.48);
    tile = Math.floor(Math.min(maxW / W, maxH / H, 64));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = tile * W + "px";
    canvas.style.height = tile * H + "px";
    canvas.width = tile * W * dpr;
    canvas.height = tile * H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bw = tile * W, bh = 46;
    beatCanvas.style.width = bw + "px";
    beatCanvas.style.height = bh + "px";
    beatCanvas.width = bw * dpr; beatCanvas.height = bh * dpr;
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    beatCanvas.style.display = mode === "rhythm" ? "block" : "none";
  }

  // 한 턴 진행. consume=true면 벽에 막혀도 턴이 지나감(리듬 모드)
  function doStep(action, consume) {
    if (action !== "wait") facing = { ...DIRS[action] };
    let next = step(state, action);
    if (!next) {
      bump(action);
      if (!consume) return false;
      next = step(state, "wait");
    }
    history.push(state);
    const dur = mode === "rhythm" ? Math.min(170, R.spb * 1000 * 0.35) : 190;
    anim = { from: state, to: next, start: performance.now(), dur };
    state = next;
    if (state.status !== "playing") { R.running = false; sting(state.status); }
    updateUI();
    return true;
  }

  function act(action) {
    if (mode === "rhythm") { rhythmInput(action); return; }
    if (anim) { queued = action; return; }
    doStep(action, false);
  }

  function bump(action) {
    if (state.status !== "playing") return;
    bumpInfo = { d: DIRS[action], start: performance.now() };
  }

  function undo() {
    if (mode === "rhythm" || !history.length) return;
    state = history.pop();
    anim = null; queued = null;
    $("overlay").classList.remove("show");
    updateUI();
  }

  function pause() {
    if (!R.running) return;
    R.running = false;
    showOverlay("일시정지", "다시 시작하면 카운트다운 후 이어서 진행해요.", [["▶ 계속하기", startClock, true]], COLORS.player);
  }

  function showOverlay(title, sub, buttons, color) {
    $("ovTitle").textContent = title;
    $("ovTitle").style.color = color || "";
    $("ovSub").textContent = sub;
    const btns = $("ovButtons");
    btns.innerHTML = "";
    for (const [label, fn, primary] of buttons) {
      const b = document.createElement("button");
      b.className = "btn" + (primary ? " primary" : "");
      b.textContent = label;
      b.onclick = fn;
      btns.appendChild(b);
    }
    $("overlay").classList.add("show");
  }

  function rank() {
    const { perfect, good, miss } = R.counts;
    const total = perfect + good + miss || 1;
    if (miss === 0 && perfect / total >= 0.8) return "S";
    if (miss === 0) return "A";
    if (miss <= 2) return "B";
    return "C";
  }

  function updateUI() {
    $("stats").textContent = mode === "rhythm" ? `턴 ${state.turn} · 콤보 ${R.combo}` : `턴 ${state.turn}`;
    if (state.status === "playing") return;
    const status = state.status;
    const nextLevel = levelIndex < LEVELS.length - 1;
    if (status === "won") { cleared.add(levelIndex); store.set("cleared", [...cleared]); renderStageBar(); }
    // 애니메이션이 끝난 뒤 결과 표시
    setTimeout(() => {
      if (state.status !== status) return;
      if (status === "won") {
        let sub = `${state.turn}턴 만에 탈출했어요.`;
        if (mode === "rhythm") {
          const c = R.counts;
          sub = `랭크 ${rank()} · PERFECT ${c.perfect} · GOOD ${c.good} · MISS ${c.miss} · 최대 콤보 ${R.maxCombo}`;
        }
        if (!nextLevel) sub += " — 모든 스테이지 클리어! 🎉";
        const buttons = [["다시하기", restart]];
        if (nextLevel) buttons.push(["다음 스테이지 →", () => { load(levelIndex + 1); if (mode === "rhythm") startClock(); }, true]);
        showOverlay("탈출 성공!", sub, buttons, COLORS.exit);
      } else {
        const buttons = mode === "rhythm" ? [["다시하기 (R)", restart, true]] : [["↶ 한 턴 되돌리기", () => { undo(); $("overlay").classList.remove("show"); }], ["다시하기", restart, true]];
        showOverlay("실패", state.cause, buttons, COLORS.patrol);
      }
    }, 280);
  }

  // ---------- 그리기 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawTiles(s, now) {
    const H = s.grid.length, W = s.grid[0].length;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const t = s.grid[y][x], px = x * tile, py = y * tile;
      if (t === "wall") {
        ctx.fillStyle = COLORS.wallSide; ctx.fillRect(px, py, tile, tile);
        ctx.fillStyle = COLORS.wallTop; ctx.fillRect(px, py, tile, tile * 0.78);
        continue;
      }
      ctx.fillStyle = (x + y) % 2 ? COLORS.floorA : COLORS.floorB;
      ctx.fillRect(px, py, tile, tile);
      if (t === "pit") {
        ctx.fillStyle = COLORS.pit;
        roundRect(px + tile * 0.08, py + tile * 0.08, tile * 0.84, tile * 0.84, tile * 0.18); ctx.fill();
      } else if (t === "crumble") {
        ctx.fillStyle = COLORS.crumble;
        roundRect(px + tile * 0.08, py + tile * 0.08, tile * 0.84, tile * 0.84, tile * 0.12); ctx.fill();
        ctx.strokeStyle = COLORS.crumbleLine; ctx.lineWidth = Math.max(1.5, tile * 0.04);
        ctx.beginPath();
        ctx.moveTo(px + tile * 0.25, py + tile * 0.2); ctx.lineTo(px + tile * 0.45, py + tile * 0.5);
        ctx.lineTo(px + tile * 0.35, py + tile * 0.8);
        ctx.moveTo(px + tile * 0.45, py + tile * 0.5); ctx.lineTo(px + tile * 0.78, py + tile * 0.42);
        ctx.stroke();
      } else if (t === "exit") {
        const pulse = exitPulse;
        ctx.save();
        ctx.shadowColor = COLORS.exit; ctx.shadowBlur = tile * (0.25 + 0.25 * pulse);
        ctx.fillStyle = COLORS.exit;
        roundRect(px + tile * 0.18, py + tile * 0.12, tile * 0.64, tile * 0.78, tile * 0.3); ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#0b3b2a";
        roundRect(px + tile * 0.3, py + tile * 0.28, tile * 0.4, tile * 0.62, tile * 0.18); ctx.fill();
      }
    }
  }

  function drawIntents(s) {
    if (s.status !== "playing") return;
    for (const e of s.enemies) {
      if (!e.intent) continue;
      const px = e.intent.x * tile, py = e.intent.y * tile;
      ctx.fillStyle = COLORS.intent;
      ctx.fillRect(px + 2, py + 2, tile - 4, tile - 4);
      ctx.save();
      ctx.setLineDash([tile * 0.12, tile * 0.08]);
      ctx.strokeStyle = e.type === "chaser" ? COLORS.chaser : COLORS.patrol;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 3, py + 3, tile - 6, tile - 6);
      ctx.restore();
      // 화살표
      const sx = (e.x + 0.5) * tile, sy = (e.y + 0.5) * tile;
      const ex = (e.intent.x + 0.5) * tile, ey = (e.intent.y + 0.5) * tile;
      const ang = Math.atan2(ey - sy, ex - sx);
      const tipX = ex - Math.cos(ang) * tile * 0.12, tipY = ey - Math.sin(ang) * tile * 0.12;
      ctx.fillStyle = e.type === "chaser" ? COLORS.chaser : COLORS.patrol;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX - Math.cos(ang - 0.5) * tile * 0.22, tipY - Math.sin(ang - 0.5) * tile * 0.22);
      ctx.lineTo(tipX - Math.cos(ang + 0.5) * tile * 0.22, tipY - Math.sin(ang + 0.5) * tile * 0.22);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawShadow(cx, cy, scale) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + tile * 0.32, tile * 0.28 * scale, tile * 0.09 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // kong 저장소 병아리 스타일: 굵은 잉크 외곽선 + 단순한 단색 면
  const INK = "#1b1d24";
  function inked(fill, lw) {
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke();
  }
  function ellipsePath(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }

  // 콩알 모양 눈 + 흰 하이라이트
  function beanEye(x, y, w, h) {
    ctx.fillStyle = INK;
    roundRect(x - w / 2, y - h / 2, w, h, w / 2); ctx.fill();
    ctx.fillStyle = "#fffdf0";
    ctx.beginPath(); ctx.arc(x - w * 0.18, y - h * 0.22, w * 0.24, 0, Math.PI * 2); ctx.fill();
  }

  function drawEnemy(e, x, y, hop) {
    const cx = (x + 0.5) * tile, cy = (y + 0.5) * tile;
    drawShadow(cx, cy, 1 - hop * 0.3);
    const by = cy - hop * tile * 0.25;
    const look = e.intent ? { x: e.intent.x - e.x, y: e.intent.y - e.y } : { x: e.dx || 0, y: e.dy || 0 };
    const lw = Math.max(2, tile * 0.05);
    if (e.type === "patrol") {
      roundRect(cx - tile * 0.32, by - tile * 0.3, tile * 0.64, tile * 0.6, tile * 0.18);
      inked(COLORS.patrol, lw);
    } else {
      ctx.beginPath();
      const spikes = 8, r1 = tile * 0.36, r2 = tile * 0.26;
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 ? r2 : r1, a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(cx + Math.cos(a) * r, by + Math.sin(a) * r);
      }
      ctx.closePath();
      inked(COLORS.chaser, lw);
    }
    // 화난 눈썹 느낌의 눈꺼풀이 있는 콩눈
    const ox = look.x * tile * 0.06, oy = look.y * tile * 0.05;
    for (const side of [-1, 1]) beanEye(cx + side * tile * 0.11 + ox, by - tile * 0.02 + oy, tile * 0.08, tile * 0.13);
    ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.8; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - tile * 0.19 + ox, by - tile * 0.14 + oy); ctx.lineTo(cx - tile * 0.05 + ox, by - tile * 0.09 + oy);
    ctx.moveTo(cx + tile * 0.19 + ox, by - tile * 0.14 + oy); ctx.lineTo(cx + tile * 0.05 + ox, by - tile * 0.09 + oy);
    ctx.stroke();
  }

  // 플레이어: 노란 유치원 모자를 쓴 병아리
  function drawPlayer(x, y, jump, status, facing) {
    const cx = (x + 0.5) * tile, cy = (y + 0.5) * tile;
    drawShadow(cx, cy, 1 - jump * 0.45);
    const u = tile * 1.08;
    const gy = cy + tile * 0.36 - jump * tile * 0.5;   // 발 위치(땅)
    const lw = Math.max(2, tile * 0.045);
    const dead = status === "dead";
    const C = dead
      ? { cream: "#cfc9b3", yellow: "#c9b25a", orange: "#c08a52" }
      : { cream: "#fff1b8", yellow: "#ffd23f", orange: "#ff9f30" };
    const back = facing.y < 0;                        // 위로 갈 땐 뒷모습
    const fx = facing.x * u * 0.05;                   // 좌우 볼 때 얼굴 이동

    ctx.save();
    // 점프할 때 늘어나고, 착지 직전엔 찌그러짐
    const stretch = 1 + jump * 0.16;
    ctx.translate(cx, gy);
    ctx.scale(1 / stretch, stretch);
    ctx.translate(-cx, -gy);

    // 날개
    for (const side of [-1, 1]) {
      const flap = jump * 0.6 * side;
      ellipsePath(cx + side * u * 0.24, gy - u * 0.2, u * 0.065, u * 0.1, side * 0.5 + flap);
      inked(C.cream, lw * 0.8);
    }
    // 몸통
    roundRect(cx - u * 0.22, gy - u * 0.33, u * 0.44, u * 0.3, u * 0.12); inked(C.cream, lw);
    // 발 (몸통 앞으로 살짝 나옴)
    for (const side of [-1, 1]) { ellipsePath(cx + side * u * 0.1, gy - u * 0.02, u * 0.085, u * 0.045); inked(C.orange, lw * 0.8); }
    // 머리 (둥근 사각형)
    roundRect(cx - u * 0.33, gy - u * 0.78, u * 0.66, u * 0.5, u * 0.17); inked(C.cream, lw);

    if (!back) {
      const ey = gy - u * 0.5;
      if (dead) {
        ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.8; ctx.lineCap = "round";
        for (const side of [-1, 1]) {
          const ex = cx + side * u * 0.13 + fx, r = u * 0.045;
          ctx.beginPath(); ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r);
          ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r); ctx.stroke();
        }
      } else {
        for (const side of [-1, 1]) beanEye(cx + side * u * 0.13 + fx, ey, u * 0.075, u * 0.12);
      }
      // 부리
      const bx = cx + fx * 1.4, byk = gy - u * 0.42;
      ctx.beginPath();
      ctx.moveTo(bx - u * 0.08, byk); ctx.lineTo(bx, byk - u * 0.055);
      ctx.lineTo(bx + u * 0.08, byk); ctx.lineTo(bx, byk + u * 0.06); ctx.closePath();
      inked(C.orange, lw * 0.7);
    }
    // 노란 모자: 둥근 정수리 + 넓은 챙
    ellipsePath(cx, gy - u * 0.8, u * 0.27, u * 0.17); inked(C.yellow, lw);
    ellipsePath(cx, gy - u * 0.74, u * 0.41, u * 0.085); inked(C.yellow, lw);
    ctx.restore();
  }

  const ease = (t) => 1 - Math.pow(1 - t, 3);

  // 박자에 맞춰 0→1→0으로 뛰는 값 (박자 순간 1)
  function beatPulse() {
    if (mode !== "rhythm" || !R.running) return 0;
    const p = (songNow() - R.t0) / R.spb;
    if (p < 0) return 0;
    return Math.pow(1 - (p - Math.floor(p)), 4);
  }

  function drawBeatBar(now) {
    const w = beatCanvas.width / (window.devicePixelRatio || 1), h = 46, cx = w / 2, cy = h / 2;
    bctx.clearRect(0, 0, w, h);
    bctx.fillStyle = "#171a33";
    roundRectOn(bctx, 0, 4, w, h - 8, 12); bctx.fill();
    const gap = Math.min(w * 0.2, 110);   // 한 박자 거리(px)
    if (R.running) {
      const t = songNow();
      for (let k = R.nextBeat; k < R.nextBeat + 5; k++) {
        const dx = ((beatTime(k) - t) / R.spb) * gap;
        if (dx > cx) break;
        const countIn = k < COUNT_IN, locked = R.locked.has(k);
        const alpha = Math.max(0, Math.min(1, 1 - dx / cx + 0.2));
        bctx.globalAlpha = alpha;
        bctx.fillStyle = locked ? "#555a80" : countIn ? "#8b90b8" : COLORS.player;
        for (const side of [-1, 1]) {
          roundRectOn(bctx, cx + side * dx - 3.5, cy - 12, 7, 24, 3.5); bctx.fill();
        }
        bctx.globalAlpha = 1;
      }
    }
    // 판정 링
    const pulse = beatPulse();
    bctx.strokeStyle = COLORS.player; bctx.lineWidth = 3;
    bctx.beginPath(); bctx.arc(cx, cy, 13 + pulse * 5, 0, Math.PI * 2); bctx.stroke();
    bctx.fillStyle = `rgba(255,210,63,${0.15 + pulse * 0.5})`;
    bctx.beginPath(); bctx.arc(cx, cy, 11, 0, Math.PI * 2); bctx.fill();
    if (!R.running && state.status === "playing") {
      bctx.fillStyle = "#8b90b8"; bctx.font = "14px Jua, sans-serif"; bctx.textAlign = "center"; bctx.textBaseline = "middle";
      bctx.fillText("Space / 탭으로 시작", cx + w * 0.27, cy);
    }
  }
  function roundRectOn(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawCenterText(text, color, scale, alpha) {
    const W = state.grid[0].length * tile, H = state.grid.length * tile;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${Math.round(tile * 1.3 * scale)}px Jua, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = tile * 0.12; ctx.strokeStyle = "#1b1d24"; ctx.lineJoin = "round";
    ctx.strokeText(text, W / 2, H / 2);
    ctx.fillStyle = color; ctx.fillText(text, W / 2, H / 2);
    ctx.restore();
  }

  function frame(now) {
    if (mode === "rhythm" && R.running) { scheduler(); catchUp(); }
    const W = state.grid[0].length, H = state.grid.length;
    ctx.clearRect(0, 0, W * tile, H * tile);

    let t = 1;
    if (anim) {
      t = Math.min(1, (now - anim.start) / anim.dur);
      if (t >= 1) {
        anim = null;
        if (queued) { const q = queued; queued = null; act(q); }
      }
    }
    const pulse = beatPulse();
    exitPulse = mode === "rhythm" && R.running ? pulse : 0.5 + 0.5 * Math.sin(now / 300);
    const view = state;
    drawTiles(view, now);
    if (pulse > 0) { ctx.fillStyle = `rgba(255,255,255,${0.035 * pulse})`; ctx.fillRect(0, 0, W * tile, H * tile); }
    if (!anim) drawIntents(view);

    const from = anim ? anim.from : null;
    const et = ease(t);
    const hop = anim ? Math.sin(Math.PI * t) : 0;

    for (const e of view.enemies) {
      const pe = from ? from.enemies.find((o) => o.id === e.id) : e;
      const moved = pe.x !== e.x || pe.y !== e.y;
      const x = pe.x + (e.x - pe.x) * et, y = pe.y + (e.y - pe.y) * et;
      drawEnemy(e, x, y, moved ? hop * 0.6 : pulse * 0.12);
    }

    let px = view.player.x, py = view.player.y, jump = 0;
    if (anim) {
      const fp = anim.from.player;
      px = fp.x + (view.player.x - fp.x) * t;
      py = fp.y + (view.player.y - fp.y) * t;
      jump = Math.sin(Math.PI * t);
    } else jump = pulse * 0.08;
    if (bumpInfo) {
      const bt = (now - bumpInfo.start) / 140;
      if (bt >= 1) bumpInfo = null;
      else { const k = Math.sin(Math.PI * bt) * 0.15; px += bumpInfo.d.x * k; py += bumpInfo.d.y * k; }
    }
    drawPlayer(px, py, jump, anim ? "playing" : view.status, facing);

    // 판정 텍스트 (플레이어 머리 위)
    if (R.judge) {
      const jt = (now - R.judge.start) / 500;
      if (jt >= 1) R.judge = null;
      else {
        ctx.save();
        ctx.globalAlpha = 1 - jt * jt;
        ctx.font = `${Math.round(tile * 0.36)}px Jua, sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const jx = Math.min(Math.max((px + 0.5) * tile, tile * 1.2), W * tile - tile * 1.2);
        const jy = Math.max((py - 0.55 - jt * 0.4) * tile, tile * 0.3);
        ctx.lineWidth = tile * 0.09; ctx.strokeStyle = "#1b1d24"; ctx.lineJoin = "round";
        ctx.strokeText(R.judge.text, jx, jy);
        ctx.fillStyle = R.judge.color; ctx.fillText(R.judge.text, jx, jy);
        ctx.restore();
      }
    }

    // 카운트다운 3 · 2 · 1 · GO!
    if (mode === "rhythm" && R.running) {
      const p = (songNow() - R.t0) / R.spb;
      const c = Math.floor(p), f = p - c;
      if (c >= 0 && c <= COUNT_IN) {
        const text = c < COUNT_IN ? String(COUNT_IN - c) : "GO!";
        drawCenterText(text, c < COUNT_IN ? "#e8eaff" : COLORS.player, 1 + (1 - f) * 0.25, 1 - f * f);
      }
      if (R.combo >= 5 && !R.judge) drawComboBadge();
    }

    if (view.status === "dead" && !anim) {
      ctx.fillStyle = "rgba(255,60,80,0.12)";
      ctx.fillRect(0, 0, W * tile, H * tile);
    }
    if (mode === "rhythm") drawBeatBar(now);
    requestAnimationFrame(frame);
  }

  function drawComboBadge() {
    ctx.save();
    ctx.font = `${Math.round(tile * 0.3)}px Jua, sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillStyle = COLORS.player;
    ctx.fillText(`${R.combo} COMBO`, state.grid[0].length * tile - tile * 0.2, tile * 0.18);
    ctx.restore();
  }

  // ---------- 입력 ----------
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
    " ": "wait", ".": "wait",
  };
  window.addEventListener("keydown", (ev) => {
    if (ev.repeat) { if (ev.key in KEYMAP) ev.preventDefault(); return; }
    if (ev.key in KEYMAP) {
      ev.preventDefault();
      if (mode === "rhythm" && !R.running && state.status === "playing" && $("overlay").classList.contains("show")) { startClock(); return; }
      act(KEYMAP[ev.key]);
      return;
    }
    if (ev.key === "z" || ev.key === "Z") undo();
    else if (ev.key === "r" || ev.key === "R") restart();
    else if ((ev.key === "n" || ev.key === "N" || ev.key === "Enter") && state.status === "won" && levelIndex < LEVELS.length - 1) {
      load(levelIndex + 1); if (mode === "rhythm") startClock();
    }
  });
  // 리듬 판정을 위해 click 대신 pointerdown
  document.querySelectorAll(".pad button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); act(b.dataset.act); }));
  $("undoBtn").onclick = undo;
  $("restartBtn").onclick = restart;
  $("modeBtn").onclick = () => {
    mode = mode === "rhythm" ? "puzzle" : "rhythm";
    store.set("mode", mode);
    load(levelIndex);
  };

  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => { const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { act("wait"); return; }
    act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("blur", pause);

  // 자동 테스트용 훅
  window.__game = { R, beatTime, songNow, get state() { return state; }, COUNT_IN, PERFECT, GOOD };

  load(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
