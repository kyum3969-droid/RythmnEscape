<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Bounce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 한 화면 게임: 캔버스가 화면 전체, HUD와 안내는 그 위에 얹는다. 어두운 단일 룩. */
  :root {
    color-scheme: dark;
    --bg: #0a0a16;
    --panel: rgba(12, 12, 28, 0.86);
    --line: rgba(255, 255, 255, 0.16);
    --text: #f4f4ff;
    --muted: #a9a9c9;
    --accent: #7df9ff;
    --danger: #ff3b6b;
    --on-accent: #06121a;
    --font: "Chakra Petch", "Black Han Sans", system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #app { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
    padding-block: 10px 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-direction: column; gap: 8px;
  }
  #bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); }
  #barFill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #bar .tick { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(255, 255, 255, 0.55); }
  #bar .tick.on { background: var(--accent); }
  #hudRow { display: flex; align-items: center; gap: 12px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
  #pct { font-size: 22px; font-weight: 700; color: var(--text); min-width: 3.2em; }
  #hudRow .grow { flex: 1; }
  #pauseBtn { pointer-events: auto; }

  .btn {
    font: inherit; font-size: 17px; font-weight: 700; color: var(--text);
    background: rgba(255, 255, 255, 0.1); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 18px; cursor: pointer; touch-action: manipulation;
  }
  .btn:active { filter: brightness(0.85); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.icon { width: 44px; height: 40px; padding: 0; font-size: 14px; }

  .zone {
    position: absolute; bottom: 0; width: 50%; pointer-events: none;
    padding-block: 0 max(14px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: rgba(255, 255, 255, 0.42); font-size: 13px; transition: color 0.08s;
  }
  .zone b { font-size: 26px; font-weight: 700; line-height: 1; }
  .zone.on { color: var(--text); text-shadow: 0 0 14px var(--accent); }
  #zoneL { left: 0; border-right: 1px dashed rgba(255, 255, 255, 0.12); }
  #app.one .zone { visibility: hidden; }              /* 피버는 원버튼(화면 어디든)이라 왼쪽·오른쪽 아이콘을 숨긴다 */
  #app.nozones .zone { visibility: hidden; }          /* 개발자 기능: 아래쪽 버튼 안내 끄기(누르는 것은 그대로 된다) */
  #devOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #devOpts .btn.small { color: var(--text); }
  #zoneR { right: 0; }
  #toast {
    position: absolute; left: 0; right: 0; top: 19%; text-align: center; pointer-events: none;
    font-size: 26px; font-weight: 700; letter-spacing: 0.12em; opacity: 0;
    text-shadow: 0 0 18px var(--accent);
  }
  #toast.show { animation: toast 1.1s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

  .layer {
    position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    background: rgba(6, 6, 16, 0.55);
  }
  .panel {
    width: 100%; max-width: 420px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 22px;
    padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center;
    backdrop-filter: blur(6px);
  }
  .panel h1 { margin: 0; font-size: 46px; font-weight: 700; letter-spacing: 0.06em; line-height: 1; text-wrap: balance; }
  .panel h1 span { color: var(--accent); }
  .panel .sub { color: var(--muted); font-size: 16px; line-height: 1.55; white-space: pre-line; }
  .panel .stat { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel .buttons { display: flex; flex-direction: column; gap: 10px; }
  #dev { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  #opts { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  #opts .btn.small { color: var(--text); }
  #opts small { color: var(--muted); font-size: 12px; }
  #trackInfo { color: var(--muted); font-size: 12px; line-height: 1.45; white-space: pre-line; font-variant-numeric: tabular-nums; }
  #rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }      /* (라운드가 열 개라 작게: 가로 화면에서 두 줄에 들어간다) */
  #rounds .btn.small { font-size: 12px; padding: 6px 6px; line-height: 1.25; }
  #rounds .btn.small { color: var(--text); }
  #rounds .btn.small[disabled] { border-color: var(--accent); color: var(--accent); opacity: 1; }
  #trackAdj { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
  #trackAdj[hidden] { display: none; }
  #devJumps { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .btn.small { font-size: 13px; font-weight: 500; padding: 8px 10px; color: var(--muted); }
  #devJumps .btn.small { color: var(--text); font-variant-numeric: tabular-nums; }
  #devTag { color: var(--danger); font-weight: 700; letter-spacing: 0.08em; }
  /* 개발자 기능: 코스 둘러보기(플레이가 아니다). 아래쪽 막대에서 퍼센트로 옮겨 다닌다 */
  #inspect {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 6px;
    padding: 6px var(--gutter-r) max(8px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: rgba(6, 6, 16, 0.82);
  }
  #inspect[hidden] { display: none; }
  #inspect input[type=range] { flex: 1 1 80px; min-width: 60px; accent-color: var(--accent); }
  #inspect input[type=number] { width: 64px; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-variant-numeric: tabular-nums; }
  #inspect .btn.small { color: var(--text); padding: 6px 8px; white-space: nowrap; }
  #app.inspect .zone, #app.inspect #pauseBtn { visibility: hidden; }
  #app.inspect #view { cursor: grab; touch-action: none; }
  .layer { overflow-y: auto; }
  @media (max-height: 480px) {             /* 가로로 든 휴대폰: 패널을 낮게 */
    .panel { padding: 14px 18px; gap: 8px; max-width: 560px; }
    .panel h1 { font-size: 30px; }
    .panel .sub { font-size: 14px; line-height: 1.35; }
    .panel .buttons { flex-direction: row; }
    .panel .buttons .btn { flex: 1; padding: 9px 12px; }
    #dev, #opts { padding-top: 8px; }
    #opts small { display: none; }
    #devJumps { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .panel:has(#rounds) { max-width: 760px; }      /* 라운드가 열여섯 개: 가로 화면에서는 패널을 넓혀 한 줄에 일곱 개(세 줄) */
    #rounds { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 5px; }
    #rounds .btn.small { font-size: 11px; padding: 5px 5px; }
  }
  @media (prefers-reduced-motion: reduce) { #toast.show { animation-duration: 0.01s; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="게임 화면. 왼쪽을 누르고 있으면 공중에서 멈춤, 오른쪽을 누르면 점프(공중에서는 이단 점프)"></canvas>

  <div id="hud">
    <div id="bar"><div id="barFill"></div></div>
    <div id="hudRow">
      <span id="pct">0%</span>
      <span id="tries">시도 1</span>
      <span class="grow"></span>
      <span id="devTag" hidden>DEV</span>
      <span id="best"></span>
      <button class="btn icon" id="pauseBtn" aria-label="일시정지">II</button>
    </div>
  </div>
  <div class="zone" id="zoneL"><b>II</b></div>
  <div class="zone" id="zoneR"><b>▲</b></div>
  <div id="toast"></div>
  <div id="inspect" hidden>
    <button class="btn small" data-mv="-16">◀ 마디</button>
    <button class="btn small" data-mv="-4">◀ 박</button>
    <input type="range" id="insRange" min="0" max="100" step="0.1" value="0" aria-label="코스에서의 위치(퍼센트)">
    <button class="btn small" data-mv="4">박 ▶</button>
    <button class="btn small" data-mv="16">마디 ▶</button>
    <input type="number" id="insPct" min="0" max="100" step="0.1" aria-label="퍼센트 직접 입력">
    <button class="btn small" id="insClose">닫기</button>
  </div>

  <div class="layer" id="overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
      <h1 id="ovTitle">PULSE <span>BOUNCE</span></h1>
      <div class="sub" id="ovSub"></div>
      <div class="stat" id="ovStat"></div>
      <div class="buttons" id="ovButtons"></div>
      <div id="rounds"></div>
      <div id="opts">
        <button class="btn small" id="trackBtn">곡 넣기</button>
        <input type="file" id="trackFile" accept="audio/*" hidden>
        <div id="trackInfo">곡 파일을 넣으면 템포와 첫 박을 재서 그 곡에 맞춰 달려요.</div>
        <div id="trackAdj" hidden>
          <button class="btn small" data-adj="shift" data-d="-1">첫 박 ◀</button>
          <button class="btn small" data-adj="shift" data-d="1">첫 박 ▶</button>
          <button class="btn small" data-adj="nudge" data-d="-10">소리 ◀ 10ms</button>
          <button class="btn small" data-adj="nudge" data-d="10">소리 ▶ 10ms</button>
          <button class="btn small" data-adj="remove">곡 빼기</button>
        </div>
      </div>
      <div id="dev">
        <button class="btn small" id="devToggle">개발자 모드: 꺼짐</button>
        <div id="devOpts" hidden>
          <button class="btn small" id="devMarks">길 위의 누르는 표시: 켜짐</button>
          <button class="btn small" id="devZones">아래쪽 버튼 안내: 켜짐</button>
          <button class="btn small" id="devGems">수정: 켜짐</button>
          <button class="btn small" id="devLabels">플레이 중 번호표: 꺼짐</button>
          <button class="btn small" id="devInspect">코스 둘러보기</button>
        </div>
        <div id="devJumps" hidden></div>
      </div>
    </div>
  </div>
</div>

<script src="logic.js"></script>
<script src="track.js"></script>
<script>
// ===================== 화면 · 음악 · 입력 =====================
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // ---------------------------------------------------------------- 저장 (이 브라우저 전용)
  const store = {
    get(k, d) { try { const v = localStorage.getItem("pulsebounce." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("pulsebounce." + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ } },
  };
  // 라운드: 고르면 코스와 곡을 다시 만들어야 해서 화면을 새로 연다
  const round = Math.max(0, Math.min(COURSES.length - 1, store.get("round", 0) | 0));
  const COURSE = COURSES[round];
  const ROUND_NO = round;
  const L = buildLevel(COURSE);
  // 그릴 때 쓰는 바닥 높이(반 칸 단위): 빨간 덩어리에 높은 박스를 합친 것. 붙어 있으면 한 덩어리로 그려진다(높은 박스를 따로 표시하지 않는다).
  const FLOOR2 = L.floorH ? (() => {
    const a = Array.from({ length: L.floorH.length * 2 }, (_, k) => (L.floorLo[k >> 1] > 0 ? 0 : L.floorH[k >> 1]));
    for (const q of L.talls) for (let k = Math.round((q.x - q.w / 2) * 2); k < Math.round((q.x + q.w / 2) * 2); k++) if (k >= 0 && k < a.length) a[k] = Math.max(a[k], q.h);
    return a;
  })() : null;
  // 떠 있는 빨간 박스(밑이 빈 것, 위가 빈 것)는 따로 그린다
  const FLOOR_FLOAT = L.floorH ? Array.from(L.floorH, (v, c) => (L.floorLo[c] > 0 ? v : 0)) : null;
  const CEIL_HANG = L.floorH ? Array.from(L.ceilH, (v, c) => (L.ceilTop[c] < 90 ? 99 : v)) : null;
  const CEIL_FLOAT = L.floorH ? Array.from(L.ceilH, (v, c) => (L.ceilTop[c] < 90 ? v : 99)) : null;
  const gotoRound = (i) => { store.set("round", i); location.reload(); };
  let SPB = 60 / L.bpm;
  const TOTAL_BEATS = L.cols / TPB;

  let best = store.get("best" + round, round === 0 ? store.get("best", 0) : 0);
  let dev = store.get("dev", false);     // 개발자 모드: 체크포인트로 바로 이동
  let devRun = false;                    // 건너뛰어 시작한 판은 최고 기록에 넣지 않는다
  // 개발자 기능: 안내 없이 해 보기. 길 위의 누르는 표시(II, ▲, 피버의 화살표)와 화면 아래쪽의 버튼 안내를 따로 끌 수 있다(개발자 모드일 때만 적용된다)
  let devMarks = store.get("devMarks", true), devZones = store.get("devZones", true), devGems = store.get("devGems", true), devLabels = store.get("devLabels", false);
  const showMarks = () => !dev || devMarks;
  const showGems = () => !dev || devGems;            // 길 위에 줄지어 있는 수정(공이 갈 길을 보여 준다)

  // ---------------------------------------------------------------- 색 (구간마다 바뀜)
  const PAL = {
    intro: { top: "#120b2e", bottom: "#3b1c6b", accent: "#7df9ff", sun: "#ff6ad5" },
    a:     { top: "#1a0f3d", bottom: "#7a1f6e", accent: "#7df9ff", sun: "#ffb347" },
    b:     { top: "#07203a", bottom: "#0f6b78", accent: "#b6ff5a", sun: "#ffe066" },
    c:     { top: "#2a0a2e", bottom: "#8c1c3a", accent: "#ffd166", sun: "#ff7b54" },
    d:     { top: "#0b0b2a", bottom: "#3d0f7a", accent: "#ff4fd8", sun: "#7df9ff" },
    rush:  { top: "#0d1b2a", bottom: "#1b6ca8", accent: "#ffef5e", sun: "#ff7ac6" },
    outro: { top: "#101a3a", bottom: "#2a6f97", accent: "#ffffff", sun: "#ffe066" },
  };
  if (COURSE.pal) Object.assign(PAL, COURSE.pal);    // 라운드마다 다른 색을 쓸 수 있다
  const SIL = "#07070f", DANGER = "#ff3b6b";
  const BENT_WALL = 3;      // 굽은 통로의 벽 두께(칸): 땅 밑과 천장 위를 이만큼만 칠한다
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  for (const p of Object.values(PAL)) for (const k of Object.keys(p)) p[k] = hex(p[k]);
  function sectionAt(bar) {
    let cur = L.sections[0];
    for (const s of L.sections) if (bar >= s.bar) cur = s;
    return cur;
  }
  // 구간 경계 앞뒤 반 마디 동안 색을 부드럽게 섞는다
  function paletteAt(beat) {
    const bar = beat / 4, cur = sectionAt(Math.floor(bar));
    const idx = L.sections.indexOf(cur), next = L.sections[idx + 1];
    const a = PAL[cur.id];
    if (next && bar > next.bar - 0.5) {
      const t = (bar - (next.bar - 0.5)) / 0.5, b = PAL[next.id];
      return { top: mix(a.top, b.top, t), bottom: mix(a.bottom, b.bottom, t), accent: mix(a.accent, b.accent, t), sun: mix(a.sun, b.sun, t) };
    }
    return a;
  }

  // ---------------------------------------------------------------- 오디오 (임시 곡: Web Audio 합성)
  const A = { ctx: null, master: null, bus: null, noise: null };
  function ensureAudio() {
    if (!A.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      A.ctx = new AC();
      const comp = A.ctx.createDynamicsCompressor();
      comp.connect(A.ctx.destination);
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.55;
      A.master.connect(comp);
      const len = A.ctx.sampleRate;
      A.noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
      const d = A.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // 피버 연출용 분석기: 곡이 이것을 지나 스피커로 간다(소리는 바꾸지 않는다). 그림이 실제 곡의 주파수에 맞춰 움직인다
      A.an = A.ctx.createAnalyser(); A.an.fftSize = 256; A.an.smoothingTimeConstant = 0.72; A.an.connect(A.ctx.destination);
      A.spec = new Uint8Array(A.an.frequencyBinCount);
    }
    if (A.ctx.state === "suspended") A.ctx.resume();
  }
  function stopTrack() { if (A.src) { try { A.src.stop(A.ctx.currentTime + 0.06); } catch (e) { /* 이미 끝남 */ } A.src = null; } }
  function newBus() {           // 죽으면 예약된 음을 한꺼번에 끊기 위해 판마다 새 버스를 쓴다
    stopTrack();
    for (const b of [A.bus, A.songBus]) if (b) { b.gain.setTargetAtTime(0, A.ctx.currentTime, 0.012); setTimeout(() => b.disconnect(), 250); }
    // 곡은 효과음과 다른 길로 내보낸다(곡에는 아무 처리도 하지 않는다: 압축기나 필터를 거치면 효과음이 날 때 곡 소리가 눌린다)
    A.songBus = A.ctx.createGain(); A.songBus.gain.value = 0.85; A.songBus.connect(A.an || A.ctx.destination);
    A.bus = A.ctx.createGain();
    A.bus.connect(A.master);
  }
  function env(dest, t, vol, attack, decay) {
    const g = A.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(dest);
    return g;
  }
  function osc(dest, t, type, freq, dur, vol, opts = {}) {
    const o = A.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    if (opts.detune) o.detune.value = opts.detune;
    let node = env(dest, t, vol, opts.attack || 0.005, dur);
    if (opts.lp) {
      const f = A.ctx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.setValueAtTime(opts.lp, t);
      if (opts.lpTo) f.frequency.exponentialRampToValueAtTime(opts.lpTo, t + dur);

    else if (DASH_KEYS.has(e.key)) { e.preventDefault(); if (phase === "title") startFresh(); else press(); }
    else if (e.key === "Escape") pause();
    else if (dev && /^[0-9]$/.test(e.key) && +e.key <= L.cps.length) devJump(+e.key - 1);   // 0 = 처음, 1~ = 체크포인트
  });
  window.addEventListener("keyup", (e) => { if (HOLD_KEYS.has(e.key) || e.key === rushKey) { keyHold = false; rushKey = null; setZones(); } });
  window.addEventListener("blur", () => { keyHold = false; holdPointers.clear(); setZones(); });
  $("pauseBtn").addEventListener("click", pause);
  $("devToggle").addEventListener("click", () => { dev = !dev; store.set("dev", dev); renderDev(); });
  $("devMarks").addEventListener("click", () => { devMarks = !devMarks; store.set("devMarks", devMarks); renderDev(); });
  $("devZones").addEventListener("click", () => { devZones = !devZones; store.set("devZones", devZones); renderDev(); });
  $("devGems").addEventListener("click", () => { devGems = !devGems; store.set("devGems", devGems); renderDev(); });
  $("devLabels").addEventListener("click", () => { devLabels = !devLabels; store.set("devLabels", devLabels); renderDev(); });
  $("devInspect").addEventListener("click", openInspect);
  $("insRange").addEventListener("input", (e) => inspectAt(+e.target.value / 100 * L.goalX));
  $("insPct").addEventListener("change", (e) => inspectAt(+e.target.value / 100 * L.goalX));
  $("insClose").addEventListener("click", closeInspect);
  $("inspect").addEventListener("click", (e) => { const b = e.target.closest("button[data-mv]"); if (b) inspectAt(+b.dataset.mv > 0 ? Math.floor((inspectX + 1e-6) / Math.abs(+b.dataset.mv) + 1) * Math.abs(+b.dataset.mv) : Math.ceil((inspectX - 1e-6) / Math.abs(+b.dataset.mv) - 1) * Math.abs(+b.dataset.mv)); });
  applySpeed(); renderSpeed();
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  new ResizeObserver(resize).observe(canvas);

  // ---------------------------------------------------------------- 매 프레임
  let lastNow = performance.now() / 1000;
  function frame() {
    const now = performance.now() / 1000, dt = Math.min(0.05, now - lastNow);
    lastNow = now;
    if (phase === "running") {
      scheduleAudio();
      advanceTo(Math.floor(songBeat() * SUB));
      if (phase === "running") {
        const zig = state.mode === "rush";
        fx.tail.push({ x: state.x, y: state.y - HALF, d: state.dashing > 0 || zig });
        while (fx.tail.length > (zig ? 22 + Math.min(14, fx.chain >> 1) : 16)) fx.tail.shift();
        refreshHud();
      }
    } else if (phase === "dead" && !fake.on && now - deadAt > 0.55) respawn();
    for (const p of fx.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
    fx.particles = fx.particles.filter((p) => p.life > 0);
    fx.shake = Math.max(0, fx.shake - dt * 1.6);
    fx.flash = Math.max(0, fx.flash - dt * 5);
    draw(phase === "running" ? songBeat() : state.step / SUB, now);
    requestAnimationFrame(frame);
  }

  // 자동 테스트용 훅
  window.__game = {
    L, fake, get state() { return state; }, get phase() { return phase; }, get tries() { return tries; }, get broken() { return broken; },
    press, startFresh, respawn, pause, view, fx, devJump, cam: (x) => camAt(x), climb: (x) => ({ at: climbAt(x), cam: view.camY || 0, line: camLine(x), any: CLIMB.length > 0 }), bandRuns: BAND_RUNS, ballAt: (x, hgt, now, smooth = true) => ballScreen(x, hgt, now, smooth), openInspect, closeInspect, inspectAt, get labels() { return LABELS; }, get inspectX() { return inspectX; }, get bpm() { return L.bpm; }, get spb() { return SPB; }, get dev() { return dev; }, get best() { return best; },
    setBot(plan) { bot = plan ? planInput(plan) : null; }, holding,
    get gems() { return { got: gotGems.size, passed: gemPtr, total: L.gems.length }; }, get songLoading() { return songLoading; }, round,
    get track() { return track; }, get trackZero() { return track ? trackZero() : null; },
    loadTrackPCM(samples, sr, name) { const b = new AudioBuffer({ length: samples.length, sampleRate: sr, numberOfChannels: 1 }); b.copyToChannel(samples, 0); return setTrackBuffer(b, name, null).ok; },
    tickTo(beat) { fake.beat = beat; advanceTo(Math.floor(beat * SUB)); refreshHud(); },
  };

  buildTicks();
  renderDev();
  resize();
  showTitle();
  refreshHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
